    const cleared = n.status === "cleared";
    const html =
      '<div class="pin ' + n.type + (cleared ? " cleared" : "") + '" data-node="' + n.nodeId + '">' +
        (cleared ? "✓" : n.icon) +
        (n.type !== "landmark" && !cleared ? '<span class="diff">' + n.difficulty + "</span>" : "") +
      "</div>";
    const icon = L.divIcon({ html, className: "pinWrap",
      iconSize: [n.type === "boss" ? 42 : 34, n.type === "boss" ? 42 : 34],
      iconAnchor: [n.type === "boss" ? 21 : 17, n.type === "boss" ? 21 : 17] });
    const m = L.marker([n.latitude, n.longitude], { icon }).addTo(this.map);
    m.on("click", () => this.openNode(n));
    this.nodeMarkers[n.nodeId] = m;
  },

  /* ---- Position pipeline ---- */
  onPosition() {
    const p = Loc.last;
    if (!p) return;

    // Location started working — by the button, by the browser's own settings,
    // or by a watch that finally delivered. Get the dialog out of the way.
    if (this._gate && !Loc.simulated && Loc.status === "live") {
      this._gate.close();
      UI.toast("Location on" + (p.accuracy ? " — ±" + Math.round(p.accuracy) + " m" : "") + ".", "good", 2800);
    }

    this.ch.position = { latitude: p.latitude, longitude: p.longitude, lastUpdated: nowTs() };

    if (this.mapless) {
      this.ensureZone();
      this.checkProximity();
      this.renderListView();
      this.renderHud();
      this.refreshDevReadout();
      Characters.save(this.ch);
      return;
    }

    if (!this.playerMarker) {
      this.playerMarker = L.marker([p.latitude, p.longitude], {
        icon: L.divIcon({ html: '<div class="playerPin"></div>', className: "pinWrap",
                          iconSize: [20, 20], iconAnchor: [10, 10] }), zIndexOffset: 1000
      }).addTo(this.map);
      this.map.setView([p.latitude, p.longitude], settings().mapZoom);
    } else {
      this.playerMarker.setLatLng([p.latitude, p.longitude]);
      if (settings().followPlayer) this.map.panTo([p.latitude, p.longitude], { animate: true, duration: .5 });
    }

    if (this.accCircle) this.map.removeLayer(this.accCircle);
    if (p.accuracy && p.accuracy > 8) {
      this.accCircle = L.circle([p.latitude, p.longitude], {
        radius: p.accuracy, color: "#4a8fd4", weight: 1, opacity: .3,
        fillColor: "#4a8fd4", fillOpacity: .07, interactive: false
      }).addTo(this.map);
    }

    if (this.rangeCircle) this.map.removeLayer(this.rangeCircle);
    this.rangeCircle = L.circle([p.latitude, p.longitude], {
      radius: settings().interactRange, color: "#54b37a", weight: 1, opacity: .45,
      fillColor: "#54b37a", fillOpacity: .05, interactive: false
    }).addTo(this.map);

    this.trailPts.push([p.latitude, p.longitude]);
    if (this.trailPts.length > 400) this.trailPts.shift();
    this.trail.setLatLngs(this.trailPts);

    this.ensureZone();
    this.checkProximity();
    this.renderHud();
    this.refreshDevReadout();
    Characters.save(this.ch);
  },

  checkProximity() {
    if (this.inCombat || !this.nodes.length) return;
    const s = settings();
    let changed = false;
    for (const n of this.nodes) {
      const d = Loc.distanceTo(n);
      if (d == null) continue;
      const near = d <= s.interactRange;
      const pinEl = document.querySelector('.pin[data-node="' + n.nodeId + '"]');
      if (pinEl) pinEl.classList.toggle("inrange", near && n.status !== "cleared");

      if (near && n.status === "undiscovered") {
        Zones.updateNode(n, { status: "discovered", discoveredAt: nowTs() });
        changed = true;
        UI.toast("Discovered: " + esc(n.name), "good", 3000);
        this.drawNode(n);
      }
      if (near && n.status === "discovered" && !this._pendingNode) {
        this._pendingNode = n.nodeId;
        this.openNode(n);
      }
      if (!near && this._pendingNode === n.nodeId) this._pendingNode = null;
    }
    if (changed) this.renderHud();
  },

  /* ---- HUD ---- */
  renderHud() {
    const c = this.ch;
    if (!c || !$("#chName")) return;
    Characters.refreshMaxes(c);
    $("#chAvatar").textContent = CLASSES[c.class].icon;
    $("#chName").textContent = c.name;
    $("#chSub").textContent = "Lv " + c.level + " " + c.race + " " + c.class +
      (c.unspentPoints ? "  ·  " + c.unspentPoints + " pts" : "");
    const btn = $("#btnSheet");
    if (btn) {
      const has = c.unspentPoints > 0;
      let dot = btn.querySelector(".dot");
      if (has && !dot) { dot = el("span", "dot"); btn.appendChild(dot); }
      if (!has && dot) dot.remove();
    }

    const s = c.stats;
    setBar("nHp", "hp", s.hp, s.maxHp);
    setBar("nMp", "mp", s.mana, s.maxMana);
    setBar("nSp", "sp", s.stamina, s.maxStamina);
    const need = Calc.xpForLevel(c.level);
    setBar("nXp", "xp", c.experience, need);

    const w = Walk.data();
    $("#wToday").textContent = fmtDist(w.meters);
    $("#wTotal").textContent = fmtDist(w.total);
    const near = Loc.nearest(this.nodes);
    $("#wNear").textContent = near ? fmtDist(near.distance) : "--";
    const gps = $("#wGps");
    const sim = settings().locationMode === "sim";
    const live = Loc.status === "live";
    gps.textContent = sim ? "simulated"
                    : live ? (Loc.last && Loc.last.accuracy ? "GPS ±" + Math.round(Loc.last.accuracy) + " m" : "GPS live")
                    : Loc.status === "requesting" ? "asking…"
                    : "Enable GPS";
    gps.className = "gpsChip" + (sim ? " warn" : live ? " ok" : " action");
    const row = $("#modeRow");
    if (row) row.classList.toggle("simOn", sim);
    const box = $("#modeToggle");
    if (box && box.checked !== sim) box.checked = sim;

    function setBar(numId, kind, cur, max) {
      const numEl = $("#" + numId);
      if (!numEl) return;
      numEl.textContent = Math.round(cur) + " / " + Math.round(max);
      const fill = numEl.parentElement.querySelector(".fill." + kind);
      if (fill) fill.style.width = (max > 0 ? clamp(cur / max * 100, 0, 100) : 0) + "%";
    }
  },

  setLocStatus(msg) {
    this.locMsg = msg;
    if (msg) UI.toast(msg, "info", 3200);
  },

  /** Switch between your real position and simulated dev testing. */
  setLocationMode(mode, quiet) {
    saveSettings({ locationMode: mode, devMode: mode === "sim" ? true : settings().devMode });
    Loc.stop();
    if (this._simWalk) { clearInterval(this._simWalk); this._simWalk = null; }
    if (mode === "gps") {
      Loc.simulated = false;
      Loc.status = "idle";
      this.beginLocation();
      if (!quiet) UI.toast("Using your real location.", "good", 2600);
    } else {
      Loc.startSimulated();
      this.buildDevPanel(true);
      if (!quiet) UI.toast("Dev testing on — click the map to move.", "warn", 3000);
    }
    this.buildDevPanel();
    this.renderHud();
    const box = $("#modeToggle");
    if (box) box.checked = mode === "sim";
  },

  /**
   * Decide how to obtain location. Nothing is requested silently: if the
   * browser hasn't already granted permission we put a button in front of the
   * player, because several browsers only raise the prompt while the page has
   * user activation.
   */
  async beginLocation(force) {
    const s = settings();
    if (s.locationMode === "sim") { Loc.start(); return; }

    const d = Loc.diagnose();
    const perm = await Loc.permissionQuery();
    d.permission = perm;
    this._diag = d;

    if (!d.hasGeo) { this.showLocationGate("nogeo", d); return; }
    // Already granted (and still granted) — nothing to ask, just watch.
    if (perm === "granted" && !force) { Loc.start(); return; }
    // Order matters: file:// is the root cause even when it surfaces as
    // "denied", and Firefox will still grant it, so the button stays live.
    if (d.isFile)     { this.showLocationGate("file", d); return; }
    if (!d.canPrompt) { this.showLocationGate("insecure", d); return; }
    if (perm === "denied") { this.showLocationGate("denied", d); return; }
    this.showLocationGate("ask", d);
  },

  /** The one screen that actually asks for permission. */
  showLocationGate(reason, d) {
    if (this._locPrompt) return;
    this._locPrompt = true;
    this.renderHud();

    const serveCmd = "python3 -m http.server 8000";
    const blocks = {
      ask: {
        title: "Turn on location", icon: "📍",
        lead: "This game moves your character with your phone's GPS, so it needs permission to read your position.",
        detail: "Tap <b>Allow location</b> below and your browser will ask. Choose <b>Allow while using the app</b>. " +
                "Nothing leaves your device — the position is only used to move you on the map.",
        primary: { label: "Allow location", act: "request" }
      },
      denied: {
        title: "Location is blocked", icon: "🚫",
        lead: "Your browser has location switched off for this page, so it won't even show the prompt.",
        detail: "<b>Chrome / Edge:</b> tap the icon to the left of the address bar → <b>Permissions</b> → " +
                "set <b>Location</b> to Allow, then reload.<br><br>" +
                "<b>Safari on iPhone:</b> <b>aA</b> in the address bar → <b>Website Settings</b> → " +
                "<b>Location</b> → Allow. Also check <b>Settings → Privacy &amp; Security → Location Services → Safari</b>.<br><br>" +
                "<b>Firefox:</b> padlock → clear the blocked Location permission, then reload.",
        primary: { label: "Ask again", act: "request" }
      },
      file: {
        title: "Open this over http, not as a file", icon: "🔒",
        lead: "The page is open straight off the disk (<span class='mono tiny'>file://</span>). " +
              "Chrome and Safari can't attach a location permission to a file, so they never ask — " +
              "which is exactly what you're seeing.",
        detail: "<b>On this computer</b> — put the file in a folder, open a terminal there and run:" +
                "<div class='cmd'><code>" + serveCmd + "</code></div>" +
                "then visit <span class='mono'>http://localhost:8000/" +
                  esc((location.pathname.split("/").pop() || "").replace(/^index\.html$/, "")) + "</span>. " +
                "Localhost counts as secure, so the prompt appears.<br><br>" +
                "<b>On your phone</b> — it needs a real <b>https</b> address. Drop the file on any static host " +
                "(GitHub Pages, Netlify Drop, Cloudflare Pages), or tunnel your laptop's server with " +
                "<span class='mono'>cloudflared tunnel --url http://localhost:8000</span>. " +
                "A plain <span class='mono'>http://192.168.x.x</span> address will not work.",
        primary: { label: "Try anyway", act: "request" }
      },
      insecure: {
        title: "This page isn't on a secure origin", icon: "🔒",
        lead: "Browsers only hand out GPS over <b>https</b>, or on <b>localhost</b>. This page is served from " +
              "<span class='mono'>" + esc(d.protocol + "//" + d.host) + "</span>, so location is blocked before it can ask.",
        detail: "Serve the file over https, or reach it as <span class='mono'>http://localhost</span> on the machine " +
                "that's hosting it. A LAN address like <span class='mono'>http://192.168.1.20</span> is not " +
                "treated as secure and will always fail.",
        primary: { label: "Try anyway", act: "request" }
      },
      nogeo: {
        title: "No location support", icon: "🧭",
        lead: "This browser doesn't expose the Geolocation API at all.",
        detail: "Try Chrome, Safari or Firefox. Until then, dev testing lets you play by tapping the map.",
        primary: null
      }
    };
    const b = blocks[reason] || blocks.ask;

    const body = el("div");
    body.innerHTML =
      '<p style="margin:0 0 12px;color:var(--ink-2);line-height:1.55">' + b.lead + "</p>" +
      '<div class="noteBox">' + b.detail + "</div>" +
      '<div id="gateResult" class="err" style="margin-top:10px"></div>' +
      '<button class="btn ghost block sm" id="gateDiag" style="margin-top:4px">Show diagnostics</button>' +
      '<pre class="diagBox hidden" id="gateDiagBox"></pre>';

    const buttons = [{ label: "Dev testing instead", cls: "ghost", onClick: () => { this.setLocationMode("sim"); } }];
    if (b.primary) {
      buttons.push({
        label: b.primary.label, cls: "primary",
        onClick: (close, root) => {
          const out = $("#gateResult", root);
          out.style.color = "var(--ink-2)";
          out.textContent = "Waiting for your browser…";
          Loc.requestPermission().then(r => {
            if (r.ok) {
              UI.toast("Location on. ±" + Math.round(r.accuracy) + " m.", "good", 3000);
              close();
              return;
            }
            out.style.color = "var(--blood)";
            out.textContent = r.code === 1
              ? "Blocked by the browser — see the steps above."
              : r.code === 3 ? "Timed out. Outdoors or by a window helps."
              : (r.message || "Position unavailable.");
            this.renderHud();
          });
          return true;   // keep the dialog open until we know
        }
      });
    }

    this._gate = UI.modal({
      title: b.title, icon: b.icon, body, buttons,
      onClose: () => { this._locPrompt = false; this._gate = null; this.renderHud(); }
    });

    $("#gateDiag", body).onclick = () => {
      const box = $("#gateDiagBox", body);
      box.textContent = JSON.stringify(Loc.diagnose(), null, 2);
      box.classList.toggle("hidden");
    };
  },

  /** Tapping a healthy GPS chip shows what the browser is actually reporting. */
  locationDiagnostics() {
    const d = Loc.diagnose();
    const p = Loc.last;
    UI.modal({
      title: "Location", icon: "📍",
      body:
        '<div class="kv"><span>Source</span><b>' + (Loc.simulated ? "Simulated" : "Device GPS") + "</b></div>" +
        '<div class="kv"><span>Permission</span><b>' + esc(d.permission) + "</b></div>" +
        '<div class="kv"><span>Accuracy</span><b>' + (p && p.accuracy ? "±" + Math.round(p.accuracy) + " m" : "—") + "</b></div>" +
        '<div class="kv"><span>Position</span><b class="tiny">' +
          (p ? p.latitude.toFixed(5) + ", " + p.longitude.toFixed(5) : "—") + "</b></div>" +
        '<div class="kv"><span>Last fix</span><b>' +
          (p ? Math.round((nowTs() - p.ts) / 1000) + " s ago" : "—") + "</b></div>" +
        '<div class="kv"><span>Origin</span><b class="tiny">' + esc(d.protocol + "//" + d.host) + "</b></div>" +
        '<p class="tiny dimmer" style="margin:12px 0 0">Keep the screen awake while you walk — most phones ' +
        "stop feeding GPS to a background tab.</p>",
      buttons: [{ label: "Close", cls: "ghost" }]
    });
  },

  /** A watch that was running has stopped producing fixes. */
  onLocationProblem(reason, code) {
    if (this._locPrompt) return;
    this.renderHud();
    this.showLocationGate(code === 1 ? "denied" : "ask", Loc.diagnose());
    const out = $("#gateResult");
    if (out) { out.style.color = "var(--warn)"; out.textContent = reason; }
  },

  /* ---- Walking rewards: the nag loop ---- */
  onWalked(meters, w) {
    if (!this.ch) return;
    // Stamina trickles back as you move; standing still doesn't refill it.
    const c = this.ch;
    c.stats.stamina = clamp(c.stats.stamina + meters * 0.22, 0, c.stats.maxStamina);
    c.stats.mana    = clamp(c.stats.mana + meters * 0.06, 0, c.stats.maxMana);

    // 1 XP per 4 metres, banked so partial metres aren't lost.
    const bank = (w.xpBanked || 0) + meters / 4;
    const whole = Math.floor(bank);
    w.xpBanked = bank - whole;
    if (whole > 0) {
      const gains = Characters.addXp(c, whole);
      gains.forEach(g => this.announceLevel(g));
    }
    const goal = settings().dailyGoalMeters;
    if (!w.goalHit && w.meters >= goal) {
      w.goalHit = true;
      c.gold += 150;
      const bonus = Items.generate(c.level, c.attributes.luck + 6, 4);
      this.giveItem(bonus);
      UI.toast("Daily goal met — " + fmtDist(goal) + ". +150 gold and " + esc(bonus.name) + ".", "good", 5000);
    }
    Store.set(K.walk, w);
    Characters.save(c);
    this.renderHud();
  },

  passiveRegen() {
    if (!this.ch || this.inCombat) return;
    const c = this.ch;
    const before = c.stats.hp;
    c.stats.hp = clamp(c.stats.hp + Math.max(1, c.stats.maxHp * 0.012), 0, c.stats.maxHp);
    c.stats.mana = clamp(c.stats.mana + Math.max(1, c.stats.maxMana * 0.02), 0, c.stats.maxMana);
    if (c.stats.hp !== before) { Characters.save(c); this.renderHud(); }
  },

  announceLevel(g) {
    const c = this.ch;
    UI.toast("Level " + g.level + "! +5 attribute points.", "good", 4200);
    if (g.unlocked && g.unlocked.length) {
      g.unlocked.forEach(sk => UI.toast("New ability: " + sk.icon + " " + sk.name, "good", 4600));
    }
  },

  giveItem(item) {
    const c = this.ch;
    if (!c.inventory) c.inventory = [];
    if (c.inventory.length >= 20) {
      UI.toast("Pack full — " + esc(item.name) + " left behind.", "bad", 3200);
      return false;
    }
    c.inventory.push(item);
    Store.patch(K.inventories, (all) => { all[c.characterId] = c.inventory; });
    API.request("/inventory/item/add", "POST", { characterId: c.characterId, item });
    return true;
  }
};
/* -------------------------------------------------------------------------
   17. Node interaction
   ------------------------------------------------------------------------- */
Object.assign(Game, {
  openNode(n) {
    if (this.inCombat) return;
    const d = Loc.distanceTo(n);
    const s = settings();
    const inRange = d != null && d <= s.interactRange;
    const cleared = n.status === "cleared";

    const typeLabel = { combat: "Combat site", treasure: "Cache", boss: "Boss lair", landmark: "Landmark" }[n.type];
    let body =
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
        '<div class="avatar" style="width:46px;height:46px;font-size:24px">' + n.icon + "</div>" +
        "<div><b style='font-size:15px'>" + esc(n.name) + "</b><br>" +
        '<span class="tiny dim">' + typeLabel +
        (n.type !== "landmark" ? " · Difficulty " + n.difficulty + "/10" : "") + "</span></div></div>" +
      '<div class="kv"><span>Distance</span><b>' + fmtDist(d) + "</b></div>" +
      '<div class="kv"><span>From home</span><b>' + fmtDist(n.distanceFromHome) + "</b></div>" +
      (n.anchorKind ? '<div class="kv"><span>Standing on</span><b>' + esc(cap(n.anchorKind)) + "</b></div>" : "") +
      '<div class="kv"><span>Status</span><b>' + cap(n.status) + "</b></div>";

    if (n.type !== "landmark" && !cleared) {
      body += '<div class="kv"><span>Expected reward</span><b>' +
        n.rewards.experience + " XP · " + n.rewards.gold + " g</b></div>";
    }
    if (!inRange && !cleared) {
      body += '<p class="tiny" style="color:var(--warn);margin:12px 0 0">' +
        "Walk within " + s.interactRange + " m to interact. You're " + fmtDist(d) + " away." +
        "</p>";
    }

    const buttons = [{ label: "Close", cls: "ghost" }];
    if (!cleared && inRange) {
      if (n.type === "combat" || n.type === "boss") {
        buttons.push({ label: n.type === "boss" ? "Challenge" : "Engage", cls: "danger",
          onClick: () => { Combat.begin(n); } });
      } else if (n.type === "treasure") {
        buttons.push({ label: "Open", cls: "primary", onClick: () => { this.looseTreasure(n); } });
      } else {
        buttons.push({ label: "Rest here", cls: "primary", onClick: () => { this.restAt(n); } });
      }
    }
    UI.modal({ title: cleared ? "Cleared" : typeLabel, icon: n.icon, body, buttons,
               onClose: () => { this._pendingNode = null; } });
  },

  looseTreasure(n) {
    const c = this.ch;
    const gold = Math.round(n.rewards.gold * rnd(0.85, 1.3));
    c.gold += gold;
    const rolls = 1 + (chance(28 + c.attributes.luck) ? 1 : 0);
    const got = [];
    for (let i = 0; i < rolls; i++) {
      const it = Items.generate(c.level, c.attributes.luck, n.difficulty);
      if (this.giveItem(it)) got.push(it);
    }
    const xp = Math.round(n.rewards.experience);
    Characters.addXp(c, xp).forEach(g => this.announceLevel(g));
    Zones.updateNode(n, { status: "cleared", clearedAt: nowTs() });
    this.drawNode(n);
    Characters.save(c);
    this.renderHud();
    this.maybeRespawn();

    UI.modal({
      title: "Cache opened", icon: "📦",
      body: '<div class="rewardRow"><span class="ic">🪙</span><div><b>' + gold + " gold</b></div></div>" +
            '<div class="rewardRow"><span class="ic">★</span><div><b>' + xp + " experience</b></div></div>" +
            got.map(it =>
              '<div class="rewardRow"><span class="ic">' + Content.itemIconHtml(it, 20) + '</span><div><b class="c-' + it.rarity + '">' +
              esc(it.name) + '</b><br><span class="tiny dim mono">' + esc(it.effect) + "</span></div></div>").join(""),
      buttons: [{ label: "Take it all", cls: "primary" }]
    });
  },

  restAt(n) {
    const c = this.ch;
    const heal = Math.round(c.stats.maxHp * 0.45);
    c.stats.hp = clamp(c.stats.hp + heal, 0, c.stats.maxHp);
    c.stats.mana = c.stats.maxMana;
    c.stats.stamina = c.stats.maxStamina;
    Zones.updateNode(n, { status: "cleared", clearedAt: nowTs() });
    this.drawNode(n);
    Characters.save(c);
    this.renderHud();
    UI.toast("Rested. +" + heal + " HP, mana and stamina restored.", "good", 3600);
  },

  maybeRespawn() {
    if (!this.zone) return;
    const made = Zones.respawnCleared(this.zone, this.ch.level);
    if (made > 0) {
      this.nodes = Zones.nodesIn(this.zone.zoneId);
      this.drawNodes();
      UI.toast(made + " new site" + (made > 1 ? "s have" : " has") + " appeared nearby.", "info", 3600);
    }
  }
});

/* -------------------------------------------------------------------------
   18. Combat
   ------------------------------------------------------------------------- */
const Combat = {
  enc: null, node: null, root: null, targetIdx: 0, busy: false, buffs: null,

  playerSnapshot() {
    const c = Game.ch;
    return {
      name: c.name,
      attackPower: Calc.attackPower(c), spellPower: Calc.spellPower(c),
      armor: Calc.armor(c) * (this.buffs && this.buffs.armorPct ? 1 + this.buffs.armorPct : 1),
      magicDefense: Calc.magicDefense(c),
      accuracy: Calc.accuracy(c), evasion: Calc.evasion(c) + (this.buffs ? this.buffs.evasion || 0 : 0),
      critChance: Calc.critChance(c), critResist: Calc.critResist(c),
      tempEvasion: 0
    };
  },

  begin(node) {
    const c = Game.ch;
    if (c.stats.hp <= 1) { UI.toast("Too hurt to fight. Rest or drink something.", "bad"); return; }
    Game.inCombat = true;
    this.node = node;
    this.buffs = { armorPct: 0, evasion: 0, regen: 0, rounds: 0, guaranteedCrit: false };
    this.targetIdx = 0;
    this.busy = false;

    const enemies = Bestiary.packFor(node, c.level);
    this.enc = {
      encounterId: uid("enc"), nodeId: node.nodeId, characterId: c.characterId,
      enemies, status: "active", rounds: 0, defending: false,
      startedAt: nowTs(), endedAt: null, log: []
    };
    Store.patch(K.encounters, (all) => { all[this.enc.encounterId] = this.enc; });
    API.request("/combat/start", "POST", this.enc);

    this.mount();
    this.log("sys", "You are set upon at <b>" + esc(node.name) + "</b>.");
    if (node.type === "boss") this.log("sys", "This one has been waiting.");
    this.render();
  },

  mount() {
    this.root = el("div");
    this.root.id = "combatScreen";
    this.root.innerHTML =
      '<div class="cbHead">' +
        '<span style="font-size:19px">' + this.node.icon + "</span>" +
        "<h3>" + esc(this.node.name) + "</h3>" +
        '<span class="badge" id="cbRound">Round 1</span>' +
      "</div>" +
      '<div class="cbEnemies" id="cbEnemies"></div>' +
      '<div class="cbLogWrap"><div class="cbLog" id="cbLog"></div></div>' +
      '<div class="cbActions">' +
        '<div class="bar" style="margin-bottom:9px"><span class="lbl">❤</span>' + UI.bar("hp", 1, 1) + '<span class="num" id="cbHp"></span></div>' +
        '<div class="bar" style="margin-bottom:11px"><span class="lbl" id="cbResIco">⚡</span>' + UI.bar("sp", 1, 1) + '<span class="num" id="cbRes"></span></div>' +
        '<div class="actGrid" id="cbActs"></div>' +
      "</div>";
    document.body.appendChild(this.root);
  },

  unmount() {
    if (this.root) this.root.remove();
    this.root = null;
    Game.inCombat = false;
  },

  log(kind, html) {
    if (!this.enc) return;
    this.enc.log.push({ kind, html, t: nowTs() });
    const host = $("#cbLog");
    if (!host) return;
    const line = el("div", "logLine " + kind, html);
    host.appendChild(line);
    const wrap = host.parentElement;
    wrap.scrollTop = wrap.scrollHeight;
    while (host.children.length > 90) host.removeChild(host.firstChild);
  },

  living() { return this.enc.enemies.filter(e => e.alive); },

  render() {
    const c = Game.ch;
    $("#cbRound").textContent = "Round " + (this.enc.rounds + 1);

    const host = $("#cbEnemies");
    host.innerHTML = "";
    this.enc.enemies.forEach((e, i) => {
      const d = el("div", "enemy" + (e.alive ? "" : " dead") + (i === this.targetIdx && e.alive ? " target" : ""));
      d.id = "en_" + e.enemyId;
      d.innerHTML =
        '<div class="face">' + e.icon + "</div>" +
        '<div class="info"><div class="top"><b>' + esc(e.name) + "</b>" +
          '<span class="tiny dimmer">Lv ' + e.level + (e.boss ? " · BOSS" : "") + "</span></div>" +
          UI.bar("hp", e.hp, e.maxHp) +
          '<div class="hpnum">' + Math.max(0, Math.round(e.hp)) + " / " + e.maxHp +
          (e.slowed > 0 ? "  ❄ slowed" : "") + "</div></div>";
      if (e.alive) d.onclick = () => { this.targetIdx = i; this.render(); };
      host.appendChild(d);
    });

    const resKey = CLASSES[c.class].resource;
    $("#cbResIco").textContent = resKey === "mana" ? "✦" : "⚡";
    setB("cbHp", "hp", c.stats.hp, c.stats.maxHp);
    setB("cbRes", resKey === "mana" ? "mp" : "sp",
         resKey === "mana" ? c.stats.mana : c.stats.stamina,
         resKey === "mana" ? c.stats.maxMana : c.stats.maxStamina);
    const resFill = $("#cbRes").parentElement.querySelector(".fill");
    resFill.className = "fill " + (resKey === "mana" ? "mp" : "sp");

    const acts = $("#cbActs");
    acts.innerHTML = "";
    const mk = (icon, label, sub, disabled, fn) => {
      const b = el("button", "actBtn");
      b.innerHTML = '<span class="ic">' + icon + "</span>" + label + (sub ? "<small>" + sub + "</small>" : "");
      b.disabled = !!disabled || this.busy;
      b.onclick = fn;
      acts.appendChild(b);
      return b;
    };
    mk("⚔️", "Attack", "free", false, () => this.playerAttack());
    Characters.skillsFor(c).forEach(sk => {
      const pool = sk.res === "mana" ? c.stats.mana : c.stats.stamina;
      mk(sk.icon, sk.name, sk.cost + " " + (sk.res === "mana" ? "MP" : "SP"),
         pool < sk.cost, () => this.useSkill(sk));
    });
    mk("🧪", "Item", "potions", false, () => this.itemMenu());
    mk("🛡️", "Defend", "+50% def", false, () => this.defend());
    mk("🏃", "Flee", "risky", false, () => this.flee());

    function setB(id, kind, cur, max) {
      const n = $("#" + id);
      n.textContent = Math.round(cur) + " / " + Math.round(max);
      const f = n.parentElement.querySelector(".fill");
      f.style.width = (max > 0 ? clamp(cur / max * 100, 0, 100) : 0) + "%";
    }
  },

  floatDamage(enemyId, text, color) {
    const host = enemyId === "player" ? $(".cbActions") : $("#en_" + enemyId);
    if (!host) return;
    const f = el("div", "floatDmg", text);
    f.style.color = color || "#fff";
    f.style.left = (30 + Math.random() * 40) + "%";
    f.style.top = "6px";
    host.style.position = "relative";
    host.appendChild(f);
    setTimeout(() => f.remove(), 950);
  },

  shake(enemyId) {
    const n = $("#en_" + enemyId);
    if (!n) return;
    n.classList.add("hit");
    setTimeout(() => n.classList.remove("hit"), 320);
  },

  /* ---- Player actions ---- */
  currentTarget() {
    let e = this.enc.enemies[this.targetIdx];
    if (!e || !e.alive) {
      const idx = this.enc.enemies.findIndex(x => x.alive);
      this.targetIdx = idx;
      e = this.enc.enemies[idx];
    }
    return e;
  },

  playerAttack() {
    const target = this.currentTarget();
    if (!target) return;
    this.busy = true; this.render();
    const atk = this.playerSnapshot();
    const opts = { kind: "phys", mult: 1, guaranteedCrit: this.buffs.guaranteedCrit };
    const r = Calc.resolveHit(atk, target, opts);
    this.buffs.guaranteedCrit = false;
    this.applyToEnemy(target, r, "You strike");
    this.afterPlayerAction();
  },

  useSkill(sk) {
    const c = Game.ch;
    const poolKey = sk.res === "mana" ? "mana" : "stamina";
    if (c.stats[poolKey] < sk.cost) { UI.toast("Not enough " + sk.res + ".", "bad"); return; }
    c.stats[poolKey] -= sk.cost;
    this.busy = true; this.render();
    const atk = this.playerSnapshot();

    if (sk.kind === "buff") {
      Object.assign(this.buffs, sk.buff, { rounds: sk.buff.rounds });
      this.log("you", "<b>" + sk.name + "</b> — " + esc(sk.desc));
    } else if (sk.kind === "heal") {
      const amount = Math.round(atk.spellPower * sk.mult);
      c.stats.hp = clamp(c.stats.hp + amount, 0, c.stats.maxHp);
      this.floatDamage("player", "+" + amount, "#6cbd74");
      this.log("you", "<b>" + sk.name + "</b> knits you back together for <b>" + amount + "</b>.");
    } else {
      let targets = [];
      if (sk.target === "all") targets = this.living();
      else if (sk.target === "random3") {
        const alive = this.living();
        for (let i = 0; i < 3 && alive.length; i++) targets.push(pick(alive));
      } else {
        const t = this.currentTarget();
        if (t) targets = [t];
      }
      this.log("you", "<b>" + sk.name + "</b>!");
      targets.forEach(t => {
        if (!t.alive) return;
        let mult = sk.mult;
        if (sk.execute && t.hp / t.maxHp < 0.3) mult *= 2;
        const r = Calc.resolveHit(atk, t, {
          kind: sk.kind === "magic" ? "magic" : "phys",
          mult, critBonus: sk.critBonus || 0,
          guaranteedCrit: this.buffs.guaranteedCrit
        });
        this.buffs.guaranteedCrit = false;
        this.applyToEnemy(t, r, sk.name);
        if (sk.applies && sk.applies.slow && t.alive) t.slowed = sk.applies.slow + 1;
      });
    }
    this.afterPlayerAction();
  },

  applyToEnemy(target, r, verb) {
    if (!r.hit) {
      this.log("you", "<b>" + esc(verb) + "</b> — and misses " + esc(target.name) + ".");
      this.floatDamage(target.enemyId, "miss", "#8892a4");
      return;
    }
    target.hp -= r.damage;
    this.shake(target.enemyId);
    this.floatDamage(target.enemyId, "-" + r.damage, r.crit ? "#e0a33e" : "#f0f4fa");
    this.log(r.crit ? "crit" : "you",
      "<b>" + esc(verb) + "</b> — " + esc(target.name) + " takes <b>" + r.damage + "</b>" +
      (r.crit ? " <b>· critical!</b>" : "") + ".");
    if (target.hp <= 0) {
      target.hp = 0; target.alive = false;
      this.log("sys", "<b>" + esc(target.name) + "</b> goes down.");
    }
  },

  defend() {
    this.busy = true;
    this.enc.defending = true;
    this.log("you", "You brace behind your guard.");
    this.render();
    this.afterPlayerAction();
  },

  itemMenu() {
    const c = Game.ch;
    const potions = (c.inventory || []).filter(i => i.type === "potion");
    if (!potions.length) { UI.toast("No potions in the pack.", "bad"); return; }
    const list = el("div", "itemList");
    potions.forEach(p => {
      const row = el("div", "item r-" + p.rarity);
      row.innerHTML = '<span class="ico">' + Content.itemIconHtml(p, 18) + '</span><div class="body"><div class="nm">' +
        esc(p.name) + '</div><div class="ds">' + esc(p.effect) + "</div></div>";
      const b = el("button", "btn sm primary", "Drink");
      b.onclick = () => { m.close(); this.drink(p); };
      const acts = el("div", "acts"); acts.appendChild(b); row.appendChild(acts);
      list.appendChild(row);
    });
    const m = UI.modal({ title: "Use an item", icon: "🎒", body: list });
  },

  drink(p) {
    const c = Game.ch;
    const before = { hp: c.stats.hp, mana: c.stats.mana, stamina: c.stats.stamina };
    for (const k in p.restore) c.stats[k] = clamp(c.stats[k] + p.restore[k], 0, c.stats["max" + cap(k)]);
    const healed = Math.round(c.stats.hp - before.hp);
    if (healed > 0) this.floatDamage("player", "+" + healed, "#6cbd74");
    c.inventory.splice(c.inventory.findIndex(i => i.itemId === p.itemId), 1);
    Store.patch(K.inventories, (all) => { all[c.characterId] = c.inventory; });
    this.busy = true;
    this.log("you", "You drink <b>" + esc(p.name) + "</b>.");
    this.render();
    this.afterPlayerAction();
  },

  flee() {
    const c = Game.ch;
    const fastest = this.living().reduce((m, e) => Math.max(m, e.attributes.dexterity), 0);
    const odds = clamp(48 + (Calc.effectiveAttrs(c).dexterity - fastest) * 3.5 +
                       (this.node.type === "boss" ? -25 : 0), 8, 92);
    this.busy = true; this.render();
    if (chance(odds)) {
      this.log("sys", "You break away and run.");
      setTimeout(() => this.end("fled"), 650);
    } else {
      this.log("foe", "You can't shake them.");
      this.afterPlayerAction();
    }
  },

  afterPlayerAction() {
    if (!this.living().length) { setTimeout(() => this.end("won"), 520); return; }
    setTimeout(() => this.enemyTurn(), 620);
  },

  enemyTurn() {
    const c = Game.ch;
    const def = this.playerSnapshot();
    if (this.enc.defending) { def.armor *= 1.5; def.magicDefense *= 1.5; }

    const order = this.living().slice().sort((a, b) => b.attributes.dexterity - a.attributes.dexterity);
    let i = 0;
    const step = () => {
      if (i >= order.length) { this.endRound(); return; }
      const e = order[i++];
      if (!e.alive) { step(); return; }
      if (e.slowed > 0) {
        e.slowed--;
        this.log("foe", esc(e.name) + " is frozen stiff and loses its turn.");
        setTimeout(step, 380);
        return;
      }
      const magic = e.caster && chance(55);
      const r = Calc.resolveHit(e, def, { kind: magic ? "magic" : "phys", mult: e.boss ? 1.15 : 1 });
      if (!r.hit) {
        this.log("foe", esc(e.name) + " swings wide.");
      } else {
        c.stats.hp = clamp(c.stats.hp - r.damage, 0, c.stats.maxHp);
        this.floatDamage("player", "-" + r.damage, r.crit ? "#e0a33e" : "#d1544a");
        const verb = e.attackName ? " uses <b>" + esc(e.attackName) + "</b>"
                   : magic ? " hurls a spell" : " hits you";
        this.log("foe", esc(e.name) + verb +
          (r.crit ? " — <b>critical!</b>" : "") + " for <b>" + r.damage + "</b>.");
      }
      this.render();
      if (c.stats.hp <= 0) { setTimeout(() => this.end("lost"), 600); return; }
      setTimeout(step, 480);
    };
    step();
  },

  endRound() {
    const c = Game.ch;
    this.enc.rounds++;
    this.enc.defending = false;
    if (this.buffs.rounds > 0) {
      this.buffs.rounds--;
      if (this.buffs.regen) {
        c.stats.hp = clamp(c.stats.hp + this.buffs.regen, 0, c.stats.maxHp);
        this.log("you", "Your guard holds — <b>+" + this.buffs.regen + "</b> HP.");
      }
      if (this.buffs.rounds === 0) {
        this.buffs.armorPct = 0; this.buffs.evasion = 0; this.buffs.regen = 0;
        this.log("sys", "Your stance fades.");
      }
    }
    // A little resource trickles back each round so long fights stay playable.
    c.stats.stamina = clamp(c.stats.stamina + c.stats.maxStamina * 0.05, 0, c.stats.maxStamina);
    c.stats.mana    = clamp(c.stats.mana + c.stats.maxMana * 0.04, 0, c.stats.maxMana);
    this.busy = false;
    this.render();
  },

  end(status) {
    const c = Game.ch;
    this.enc.status = status;
    this.enc.endedAt = nowTs();
    Store.patch(K.encounters, (all) => { all[this.enc.encounterId] = this.enc; });
    API.request("/combat/" + this.enc.encounterId + "/end", "PATCH",
      { status, rounds: this.enc.rounds, endedAt: this.enc.endedAt });

    if (status === "won") {
      const xp = this.enc.enemies.reduce((s, e) => s + e.rewards.experience, 0);
      const gold = this.enc.enemies.reduce((s, e) => s + e.rewards.gold, 0);
      c.gold += gold;
      // Authored monsters drop from their own loot table; anything without one
      // falls back to the procedural generator.
      const drops = [];
      let authoredLoot = false;
      this.enc.enemies.forEach(e => {
        if (!e.lootTableId) return;
        authoredLoot = true;
        const rolls = 1 + (e.lootRolls || 0);
        for (let r = 0; r < rolls; r++) {
          Content.rollLoot(e.lootTableId, { luck: c.attributes.luck }).forEach(defId => {
            const it = Content.toGameItem(defId, c.level);
            if (it && Game.giveItem(it)) drops.push(it);
          });
        }
      });
      if (!authoredLoot) {
        const dropRolls = this.node.type === "boss" ? 3 : (chance(55 + c.attributes.luck * 1.4) ? 2 : 1);
        for (let i = 0; i < dropRolls; i++) {
          const it = Items.generate(c.level, c.attributes.luck, this.node.difficulty + (this.node.type === "boss" ? 3 : 0));
          if (Game.giveItem(it)) drops.push(it);
        }
      }
      const gains = Characters.addXp(c, xp);
      Zones.updateNode(this.node, { status: "cleared", clearedAt: nowTs() });
      Game.drawNode(this.node);
      Characters.save(c);

      this.unmount();
      Game.renderHud();
      Game.maybeRespawn();
      UI.modal({
        title: "Victory", icon: "🏆", noClose: true,
        body:
          '<div class="rewardRow"><span class="ic">★</span><div><b>' + xp + " experience</b></div></div>" +
          '<div class="rewardRow"><span class="ic">🪙</span><div><b>' + gold + " gold</b></div></div>" +
          drops.map(it => '<div class="rewardRow"><span class="ic">' + Content.itemIconHtml(it, 20) + '</span><div><b class="c-' +
            it.rarity + '">' + esc(it.name) + '</b><br><span class="tiny dim mono">' + esc(it.effect) +
            "</span></div></div>").join("") +
          gains.map(g => '<div class="rewardRow" style="border:1px solid var(--gold)"><span class="ic">🎖️</span>' +
            "<div><b>Level " + g.level + "</b><br><span class='tiny dim'>+5 attribute points" +
            (g.unlocked.length ? " · unlocked " + g.unlocked.map(s => esc(s.name)).join(", ") : "") +
            "</span></div></div>").join(""),
        buttons: [{ label: "Continue", cls: "primary" }]
      });

    } else if (status === "lost") {
      // Roguelike-lite: you keep the character, you lose gold and wake up home.
      const lost = Math.round(c.gold * 0.25);
      c.gold -= lost;
      c.stats.hp = Math.max(1, Math.round(c.stats.maxHp * 0.3));
      c.stats.stamina = Math.round(c.stats.maxStamina * 0.4);
      Zones.updateNode(this.node, { status: "failed" });
      Game.drawNode(this.node);
      Characters.save(c);
      this.unmount();
      Game.renderHud();
      UI.modal({
        title: "You go down", icon: "💀", noClose: true,
        body: '<p style="margin:0 0 12px;color:var(--ink-2)">Someone drags you back inside. ' +
              "The site holds — it'll be waiting.</p>" +
              '<div class="rewardRow"><span class="ic">🪙</span><div><b>−' + lost + " gold</b></div></div>" +
              '<div class="rewardRow"><span class="ic">❤</span><div><b>Revived at ' + c.stats.hp + " HP</b></div></div>",
        buttons: [{ label: "Get up", cls: "primary" }]
      });

    } else {
      c.stats.stamina = clamp(c.stats.stamina - c.stats.maxStamina * 0.15, 0, c.stats.maxStamina);
      Characters.save(c);
      this.unmount();
      Game.renderHud();
      UI.toast("You got away. Winded, but whole.", "info", 3000);
    }
  }
};

  inventory() {
    const c = Game.ch;
    const body = el("div");
    const draw = () => {
      body.innerHTML = "";
      const slots = ["weapon", "armor", "trinket"];
      const slotRow = el("div", "slotRow");
      slots.forEach(sl => {
        const eq = (c.equipment || []).find(i => Items.slotOf(i) === sl);

      });

      const head = el("div");
      head.style.cssText = "display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px";
      head.innerHTML = '<h4 style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3)">Pack</h4>' +
        '<span class="tiny dimmer mono">' + (c.inventory || []).length + " / 20 · " + c.gold + " gold</span>";
      body.appendChild(head);

      const list = el("div", "itemList");
      if (!(c.inventory || []).length) list.innerHTML = '<div class="emptyMsg">Nothing but lint.</div>';
      (c.inventory || []).slice().sort((a, b) => {
        const order = ["legendary","epic","rare","uncommon","common"];
        return order.indexOf(a.rarity) - order.indexOf(b.rarity);
      }).forEach(it => {
        const row = el("div", "item r-" + it.rarity);
        row.innerHTML = '<span class="ico">' + Content.itemIconHtml(it, 18) + '</span>' +
          '<div class="body"><div class="nm c-' + it.rarity + '">' + esc(it.name) +
          ' <span class="badge">' + it.rarity + '</span></div>' +
          '<div class="ds">' + esc(it.effect) + " · " + it.price + " g</div></div>";
        const acts = el("div", "acts");
        if (it.type === "potion") {
          const b = el("button", "btn sm primary", "Drink");
          b.onclick = () => { usePotion(it); };
          acts.appendChild(b);
        } else if (Items.slotOf(it)) {
          const b = el("button", "btn sm primary", "Equip");
          b.onclick = () => { equip(it); };
          acts.appendChild(b);
        }
        const s = el("button", "btn sm ghost", "Sell");
        s.onclick = () => { sell(it); };
        acts.appendChild(s);
        row.appendChild(acts);
        list.appendChild(row);
      });
      body.appendChild(list);
    };

    function persist() {
      Store.patch(K.inventories, (all) => { all[c.characterId] = c.inventory; });
      Characters.refreshMaxes(c);
      Characters.save(c);
      Game.renderHud();
      draw();
    }
    function equip(it) {
      const sl = Items.slotOf(it);
      const cur = (c.equipment || []).find(x => Items.slotOf(x) === sl);
      if (cur) { c.equipment = c.equipment.filter(x => x !== cur); c.inventory.push(cur); }
      c.inventory = c.inventory.filter(x => x.itemId !== it.itemId);
      c.equipment = (c.equipment || []).concat([it]);
      API.request("/inventory/item/" + it.itemId + "/equip", "PATCH", { equipped: true });
      UI.toast("Equipped " + it.name + ".", "good", 1800);
      persist();
    }
    function unequip(it) {
      if (c.inventory.length >= 20) { UI.toast("Pack is full.", "bad"); return; }
      c.equipment = c.equipment.filter(x => x.itemId !== it.itemId);
      c.inventory.push(it);
      persist();
    }
    function usePotion(p) {
      for (const k in p.restore) c.stats[k] = clamp(c.stats[k] + p.restore[k], 0, c.stats["max" + cap(k)]);
      c.inventory = c.inventory.filter(x => x.itemId !== p.itemId);
      UI.toast("Drank " + p.name + ".", "good", 1800);
      persist();
    }
    function sell(it) {
      const price = Math.max(1, Math.round(it.price * 0.45 / Calc.priceMod(c)));
      c.gold += price;
      c.inventory = c.inventory.filter(x => x.itemId !== it.itemId);
      UI.toast("Sold for " + price + " gold.", "info", 1800);
      persist();
    }

    draw();
    UI.modal({ title: "Inventory", icon: "🎒", body, wide: true,
               buttons: [{ label: "Close", cls: "ghost" }] });
  },

    };
    $("#setSim", body).onchange = (e) => Game.setLocationMode(e.target.checked ? "sim" : "gps");
    $("#setSnap", body).onchange = (e) => saveSettings({ snapNodesToBuildings: e.target.checked });
    $("#setFantasy", body).onchange = (e) => {
      saveSettings({ fantasyMap: e.target.checked });
      if (!e.target.checked) {
        if (Game.worldLayer) Game.worldLayer.clearLayers();
        if (Game.tiles) Game.tiles.setOpacity(1);
      } else if (Game.world) { Game.renderWorld(Game.world); }
      else { Game._worldZone = null; Game.loadWorld(); }
    };
    $("#setTile", body).oninput = (e) => {
      $("#tileVal", body).textContent = e.target.value;
      saveSettings({ tileOpacity: +e.target.value / 100 });
      if (Game.tiles) Game.tiles.setOpacity(settings().fantasyMap ? +e.target.value / 100 : 1);
    };
    $("#setLbl", body).oninput = (e) => {
      $("#lblVal", body).textContent = e.target.value;
      saveSettings({ labelZoom: +e.target.value });
      Game.applyZoomDetail();
    };
    $("#setRange", body).oninput = (e) => {
      $("#rngVal", body).textContent = e.target.value;
      saveSettings({ interactRange: +e.target.value });
      Game.onPosition();
    };
    $("#setGoal", body).oninput = (e) => {
      $("#goalVal", body).textContent = e.target.value;
      saveSettings({ dailyGoalMeters: +e.target.value });
    };
  }
};
/* -------------------------------------------------------------------------
   20. Dev panel — test without leaving your chair
   ------------------------------------------------------------------------- */
Object.assign(Game, {
  _simWalk: null,

  buildDevPanel(forceOpen) {
    const host = $("#devPanel");
    if (!host) return;
    const s = settings();
    // The panel exists only while dev testing is switched on.
    if (s.locationMode !== "sim" && !forceOpen) { host.classList.add("hidden"); return; }
    host.classList.remove("hidden");
    const collapsed = !!this._devCollapsed;
    host.innerHTML =
      '<div class="dh">' +
        '<button class="btn sm ghost" id="dvFold" title="Collapse">' + (collapsed ? "▸" : "▾") + "</button>" +
        "<b>Dev test</b>" +
        '<button class="btn sm ghost" id="dvHide">use GPS</button></div>' +
      '<div class="db' + (collapsed ? " hidden" : "") + '">' +
        '<div class="row">' +
          '<input class="input" id="dvLat" placeholder="lat">' +
          '<input class="input" id="dvLng" placeholder="lng">' +
        "</div>" +
        '<div class="grid2">' +
          '<button class="btn sm" id="dvGo">Teleport</button>' +
          '<button class="btn sm" id="dvHome">To home</button>' +
          '<button class="btn sm" id="dvNearest">Walk to nearest</button>' +
          '<button class="btn sm" id="dvWander">Wander</button>' +
          '<button class="btn sm danger" id="dvStop">Stop</button>' +
          '<button class="btn sm ghost" id="dvSeed">Seed data</button>' +
        "</div>" +
        '<p class="devNote" id="dvOut"></p>' +
        '<p class="devNote">Tap the map to teleport there.</p>' +
      "</div>";

    $("#dvFold").onclick = () => { this._devCollapsed = !this._devCollapsed; this.buildDevPanel(true); };

    $("#dvHide").onclick = () => { this.setLocationMode("gps"); host.classList.add("hidden"); };

    $("#dvGo").onclick = () => {
      const la = parseFloat($("#dvLat").value), ln = parseFloat($("#dvLng").value);
      if (isNaN(la) || isNaN(ln)) { UI.toast("Enter a valid lat and lng.", "bad"); return; }
      Loc.simulateTo(la, ln);
    };
    $("#dvHome").onclick = () => {
      if (!this.zone) { UI.toast("No zone yet.", "bad"); return; }
      Loc.simulateTo(this.zone.centerLatitude, this.zone.centerLongitude);
    };
    $("#dvNearest").onclick = () => {
      const near = Loc.nearest(this.nodes);
      if (!near) { UI.toast("Nothing left to walk to.", "bad"); return; }
      this.walkTo(near.node.latitude, near.node.longitude);
    };
    $("#dvWander").onclick = () => this.wander();
    $("#dvStop").onclick = () => { if (this._simWalk) { clearInterval(this._simWalk); this._simWalk = null; UI.toast("Sim stopped.", "info", 1400); } };
    $("#dvSeed").onclick = () => this.seedTestData();

    this.refreshDevReadout();
  },

  refreshDevReadout() {
    const out = $("#dvOut");
    if (!out) return;
    const p = Loc.last;
    const near = Loc.nearest(this.nodes);
    out.innerHTML =
      "pos " + (p ? p.latitude.toFixed(5) + ", " + p.longitude.toFixed(5) : "—") + "<br>" +
      "src " + (Loc.simulated ? "simulated" : "gps") + " · " + Loc.status + "<br>" +
      "nodes " + this.nodes.length + " · nearest " + (near ? Math.round(near.distance) + " m" : "—");
    const la = $("#dvLat"), ln = $("#dvLng");
    if (p && la && !la.matches(":focus")) la.value = p.latitude.toFixed(6);
    if (p && ln && !ln.matches(":focus")) ln.value = p.longitude.toFixed(6);
  },

  /** Interpolate toward a point at roughly walking pace (1.4 m/s). */
  walkTo(lat, lng, done) {
    if (this._simWalk) clearInterval(this._simWalk);
    const stepMeters = 14;
    this._simWalk = setInterval(() => {
      const p = Loc.last;
      if (!p) { clearInterval(this._simWalk); this._simWalk = null; return; }
      const d = haversine(p.latitude, p.longitude, lat, lng);
      if (d < stepMeters) {
        Loc.simulateTo(lat, lng);
        clearInterval(this._simWalk); this._simWalk = null;
        if (done) done();
        return;
      }
      const bearing = this.bearingTo(p.latitude, p.longitude, lat, lng);
      const next = projectPoint(p.latitude, p.longitude, stepMeters, bearing);
      Loc.simulateTo(next.latitude, next.longitude);
    }, 700);
  },

  bearingTo(la1, lo1, la2, lo2) {
    const φ1 = toRad(la1), φ2 = toRad(la2), Δλ = toRad(lo2 - lo1);
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  },

  /** Random meander inside the zone — good for testing the walk counter. */
  wander() {
    if (!this.zone || !Loc.last) { UI.toast("No zone yet.", "bad"); return; }
    if (this._simWalk) clearInterval(this._simWalk);
    let bearing = rnd(0, 360);
    this._simWalk = setInterval(() => {
      const p = Loc.last;
      bearing += rnd(-40, 40);
      let next = projectPoint(p.latitude, p.longitude, 12, bearing);
      const fromHome = haversine(this.zone.centerLatitude, this.zone.centerLongitude,
                                 next.latitude, next.longitude);
      if (fromHome > this.zone.radius) {
        bearing = this.bearingTo(p.latitude, p.longitude,
                                 this.zone.centerLatitude, this.zone.centerLongitude);
        next = projectPoint(p.latitude, p.longitude, 12, bearing);
      }
      Loc.simulateTo(next.latitude, next.longitude);
    }, 700);
    UI.toast("Simulated walk running. ■ to stop.", "info", 2200);
  },

  /** QA seed: a level 8 character with gear, plus a stocked pack. */
  seedTestData() {
    const c = this.ch;
    Characters.addXp(c, Calc.xpForLevel(1) * 7);
    c.gold += 2000;
    for (let i = 0; i < 6; i++) {
      const it = Items.generate(c.level, 22, 8);
      this.giveItem(it);
    }
    Characters.refreshMaxes(c, true);
    Characters.save(c);
    this.renderHud();
    UI.toast("Seeded: level " + c.level + ", gear and gold.", "good", 3000);
  }
});

/* -------------------------------------------------------------------------
   21. Boot
   ------------------------------------------------------------------------- */
(function boot() {
  function go() {
    Screens.init();
    if (!Store.isDurable) {
      setTimeout(() => UI.toast(
        "This browser is blocking site storage, so progress lives in memory only and will not survive a reload. " +
        "Open the file directly in a browser tab for saving to work.", "bad", 8000), 600);
    }
    // First run: install the authored content database so the game and the
    // editor agree from the start. Never overwrites anything already there.
    if (Content.isEmpty()) ContentSeed.install();

    const user = Auth.restore();
    if (!user) { Screens.show("auth"); return; }
    const chars = Object.values(Store.get(K.characters, {}) || {}).filter(c => c.userId === user.userId);
    Screens.show(chars.length ? "select" : "create");
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go);
  else go();
})();

/* Expose a few internals for console poking / future test harnesses. */
window.SS = { Store, API, Auth, Game, Combat, Loc, Walk, Zones, Characters, Calc, Items,
              Bestiary, Screens, Atlas, OSM, Content, ContentSeed, settings, saveSettings, K };
</script>
