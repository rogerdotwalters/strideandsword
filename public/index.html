<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Stride &amp; Sword</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* ============================================================
   STRIDE & SWORD - location-based roguelike
   Single-file build. Sections:
     1. Tokens & reset      5. Map & markers
     2. Layout shell        6. Combat
     3. Auth & creation     7. Inventory
     4. HUD                 8. Dev panel
   ============================================================ */

:root{
  --bg:#0b0e14;
  --bg-2:#121722;
  --bg-3:#1a2130;
  --bg-4:#232c3d;
  --line:#2b3446;
  --line-2:#3a4661;
  --ink:#e6ecf5;
  --ink-2:#a3b0c4;
  --ink-3:#6b7a92;
  --gold:#e0a33e;
  --gold-dim:#8a6524;
  --blood:#c8453c;
  --blood-dim:#7d2b26;
  --mana:#4a8fd4;
  --stam:#5fae67;
  --xp:#9a6fd4;
  --ok:#54b37a;
  --warn:#d99a34;

  --rare-common:#9aa7ba;
  --rare-uncommon:#5fae67;
  --rare-rare:#4a8fd4;
  --rare-epic:#a76fd4;
  --rare-legendary:#e0a33e;

  --r:6px;
  --r-lg:10px;
  --shadow:0 8px 28px rgba(0,0,0,.5);
  --font:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 var(--font);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:.2px}
.hidden{display:none !important}
.mono{font-family:var(--mono)}
.dim{color:var(--ink-2)}
.dimmer{color:var(--ink-3)}
.tiny{font-size:11px}
.center{text-align:center}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--line-2)}

/* ---------- 1. Common controls ---------- */
.btn{
  border:1px solid var(--line-2);background:var(--bg-3);color:var(--ink);
  padding:9px 16px;border-radius:var(--r);font-weight:600;font-size:13px;
  transition:background .12s,border-color .12s,transform .06s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn:hover:not(:disabled){background:var(--bg-4);border-color:var(--gold-dim)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#c08a2e,#9c6d20);border-color:#d4a24c;color:#1a1206}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#d29a36,#ad7a25)}
.btn.danger{background:var(--blood-dim);border-color:var(--blood)}
.btn.danger:hover:not(:disabled){background:var(--blood)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover:not(:disabled){background:var(--bg-3)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.block{width:100%}

.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--ink-3);margin-bottom:5px;font-weight:600}
.input{
  width:100%;padding:10px 12px;border-radius:var(--r);
  border:1px solid var(--line-2);background:#0a0d14;color:var(--ink);
}
.input:focus{outline:none;border-color:var(--gold-dim);box-shadow:0 0 0 3px rgba(224,163,62,.12)}

.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg)}
.divider{height:1px;background:var(--line);margin:14px 0}
.err{color:var(--blood);font-size:12.5px;min-height:17px;margin:4px 0 8px}
.badge{
  display:inline-block;padding:2px 7px;border-radius:99px;font-size:10.5px;
  font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  border:1px solid var(--line-2);color:var(--ink-2);
}

/* ---------- 2. Layout shell ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* Full-page centered screens (auth / creation) */
.pageWrap{
  position:absolute;inset:0;overflow-y:auto;
  background:
    radial-gradient(1100px 620px at 50% -12%,rgba(224,163,62,.10),transparent 62%),
    radial-gradient(800px 500px at 12% 110%,rgba(74,143,212,.08),transparent 60%),
    var(--bg);
  padding:96px 18px 44px;
}
.pageInner{max-width:520px;margin:0 auto}
.pageInner.wide{max-width:880px}

.brand{text-align:center;margin:10px 0 26px}
.brand h1{
  font-size:34px;letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(180deg,#f2d089,#c08a2e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand p{margin:6px 0 0;color:var(--ink-3);font-size:12.5px;letter-spacing:2.2px;text-transform:uppercase}

.tabs{display:flex;gap:6px;background:var(--bg-2);padding:5px;border-radius:var(--r-lg);border:1px solid var(--line);margin-bottom:18px}
.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:var(--r);color:var(--ink-3);font-weight:600;font-size:13px}
.tabs button.on{background:var(--bg-4);color:var(--ink)}

/* ---------- 3. Character creation ---------- */
.stepBar{display:flex;gap:8px;margin-bottom:20px}
.stepBar div{flex:1;height:3px;border-radius:3px;background:var(--bg-4)}
.stepBar div.on{background:var(--gold)}

.pickGrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.pick{
  text-align:left;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:14px;transition:.12s;
}
.pick:hover{border-color:var(--line-2);background:var(--bg-3)}
.pick.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(224,163,62,.12),transparent)}
.pick h4{font-size:15px;display:flex;align-items:center;gap:8px}
.pick .ico{font-size:19px}
.pick p{margin:6px 0 8px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.pick .mods{display:flex;flex-wrap:wrap;gap:5px}
.pick .mods span{font-size:10.5px;padding:2px 6px;border-radius:4px;background:var(--bg-4);color:var(--ink-2);font-family:var(--mono)}

.attrRow{
  display:grid;grid-template-columns:1fr auto auto auto auto;
  align-items:center;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--line);
}
.attrRow:last-child{border-bottom:0}
.attrRow .nm{font-weight:600;font-size:13.5px}
.attrRow .nm small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.attrRow .val{font-family:var(--mono);font-size:17px;min-width:30px;text-align:center;font-weight:700}
.attrRow .bonus{font-family:var(--mono);font-size:11.5px;min-width:34px;text-align:right}
.attrRow .bonus.pos{color:var(--ok)}
.attrRow .bonus.neg{color:var(--blood)}
.stepper{width:28px;height:28px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--bg-3);font-weight:700;line-height:1;padding:0}
.stepper:disabled{opacity:.3}
.poolBox{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--bg-3);border-radius:var(--r);margin-bottom:12px}
.poolBox b{font-family:var(--mono);font-size:19px;color:var(--gold)}

.previewGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.previewGrid .pv{background:var(--bg-3);border-radius:var(--r);padding:10px 12px}
.previewGrid .pv span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink-3)}
.previewGrid .pv b{font-family:var(--mono);font-size:18px}

/* ---------- 4. Game shell + HUD ---------- */
#gameScreen{display:flex;flex-direction:column}
#map{flex:1;width:100%;background:#0a0d14;z-index:1}

.topBar{
  position:absolute;top:0;left:0;right:0;z-index:600;
  display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:linear-gradient(180deg,rgba(11,14,20,.96),rgba(11,14,20,.72) 70%,transparent);
  pointer-events:none;
}
.topBar > *{pointer-events:auto}
.charChip{
  display:flex;align-items:center;gap:9px;background:rgba(18,23,34,.94);
  border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 6px;
  box-shadow:var(--shadow);
}
.avatar{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:16px;background:var(--bg-4);border:1px solid var(--line-2);flex:none;
}
.charChip .who{line-height:1.25;min-width:0}
.charChip .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.charChip .who span{font-size:10.5px;color:var(--ink-3)}
.iconBtn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:rgba(18,23,34,.94);display:grid;place-items:center;font-size:16px;
  box-shadow:var(--shadow);padding:0;position:relative;
}
.iconBtn:hover{background:var(--bg-4)}
.iconBtn .dot{position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:2px solid var(--bg-2)}
.spacer{flex:1}

.bars{
  position:absolute;left:10px;right:10px;bottom:10px;z-index:600;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;
}
.barsInner{
  background:rgba(18,23,34,.94);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:10px 12px;box-shadow:var(--shadow);pointer-events:auto;
}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar:last-child{margin-bottom:0}
.bar .lbl{width:16px;font-size:11px;color:var(--ink-3);text-align:center}
.track{flex:1;height:9px;background:#080b11;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:9px;transition:width .35s ease}
.fill.hp{background:linear-gradient(90deg,#8e2f28,#d1544a)}
.fill.mp{background:linear-gradient(90deg,#2c5f96,#5a9fe0)}
.fill.sp{background:linear-gradient(90deg,#3a7a46,#6cbd74)}
.fill.xp{background:linear-gradient(90deg,#6a4a99,#a97fe0)}
.bar .num{font-family:var(--mono);font-size:11px;color:var(--ink-2);min-width:64px;text-align:right}

.walkStrip{
  display:flex;gap:6px;flex-wrap:wrap;
}
.walkStrip .st{
  flex:1;min-width:78px;background:rgba(18,23,34,.94);border:1px solid var(--line);
  border-radius:var(--r);padding:6px 9px;pointer-events:auto;box-shadow:var(--shadow);
}
.walkStrip .st span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-3)}
.walkStrip .st b{font-family:var(--mono);font-size:14px}

/* location mode row */
.modeRow{
  display:flex;align-items:center;gap:10px;padding:8px 12px;pointer-events:auto;
  background:rgba(18,23,34,.94);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);cursor:pointer;
}
.modeRow input{accent-color:var(--warn);width:17px;height:17px;flex:none;margin:0}
.modeLbl{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.modeRow .lbl{flex:1;font-size:12.5px;font-weight:600;line-height:1.2}
.modeRow .lbl small{display:block;font-weight:400;color:var(--ink-3);font-size:10.5px}
.modeRow.simOn{border-color:var(--warn);background:linear-gradient(90deg,rgba(217,154,52,.14),rgba(18,23,34,.94))}
.gpsChip{
  font-family:var(--mono);font-size:11.5px;white-space:nowrap;flex:none;
  border:1px solid transparent;background:transparent;padding:5px 9px;border-radius:99px;
  color:var(--ink-2);
}
.gpsChip.ok{color:var(--ok)}
.gpsChip.warn{color:var(--warn)}
.gpsChip.action{
  color:#1a1206;background:linear-gradient(180deg,#c08a2e,#9c6d20);
  border-color:#d4a24c;font-family:var(--font);font-weight:700;
  animation:nudge 2.4s ease-in-out infinite;
}
.gpsChip.action:hover{background:linear-gradient(180deg,#d29a36,#ad7a25)}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(224,163,62,.5)}60%{box-shadow:0 0 0 9px rgba(224,163,62,0)}}

/* permission gate */
.noteBox{
  background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;font-size:12.5px;line-height:1.6;color:var(--ink-2);
}
.noteBox b{color:var(--ink)}
.cmd{
  margin:9px 0;background:#080b11;border:1px solid var(--line-2);border-radius:var(--r);
  padding:9px 11px;overflow-x:auto;
}
.cmd code{font-family:var(--mono);font-size:12px;color:var(--gold);white-space:pre}
.diagBox{
  margin:8px 0 0;background:#080b11;border:1px solid var(--line);border-radius:var(--r);
  padding:10px;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);
  overflow-x:auto;white-space:pre;
}

/* fantasy world overlay */
.fRoad{stroke-linecap:round;transition:stroke-opacity .2s}
.fRoad:hover{stroke-opacity:1 !important}
.fBuilding{transition:fill-opacity .2s;display:none}
.fBuilding:hover{fill-opacity:.62 !important}
#map.zBuildings .fBuilding{display:block}
.leaflet-tooltip.streetLabel,
.leaflet-tooltip.buildingLabel{
  background:rgba(11,14,20,.92);border:1px solid var(--line-2);color:var(--ink);
  font-size:11.5px;font-weight:600;letter-spacing:.2px;padding:3px 7px;border-radius:5px;
  box-shadow:0 3px 10px rgba(0,0,0,.55);
}
.leaflet-tooltip.streetLabel{color:#e8d3a4;border-color:var(--gold-dim)}
.leaflet-tooltip.streetLabel::before,
.leaflet-tooltip.buildingLabel::before{display:none}
.worldLabel{
  position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-size:11px;font-weight:700;letter-spacing:.3px;pointer-events:none;
  text-shadow:0 0 4px #05070b,0 0 8px #05070b,0 1px 2px #05070b;
}
.worldLabel.sLabel{color:#eccf93;text-transform:uppercase;font-size:10.5px;letter-spacing:1px}
.worldLabel.bLabel{color:#cfe0f5;font-size:10.5px;font-weight:600}

/* toasts */
#toasts{position:fixed;top:60px;left:0;right:0;z-index:1400;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{
  background:rgba(26,33,48,.97);border:1px solid var(--line-2);border-left:3px solid var(--gold);
  padding:8px 14px;border-radius:var(--r);font-size:13px;box-shadow:var(--shadow);
  max-width:min(440px,92vw);animation:tin .25s ease;
}
.toast.good{border-left-color:var(--ok)}
.toast.bad{border-left-color:var(--blood)}
.toast.info{border-left-color:var(--mana)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---------- 5. Map markers ---------- */
.leaflet-container{background:#0a0d14;font-family:var(--font)}
.leaflet-tile-pane{filter:invert(1) hue-rotate(185deg) brightness(.86) contrast(.92) saturate(.7)}
.leaflet-control-attribution{background:rgba(11,14,20,.8) !important;color:var(--ink-3) !important;font-size:9.5px}
.leaflet-control-attribution a{color:var(--ink-2) !important}
/* keep the zoom control clear of the character chip */
.leaflet-top.leaflet-left{padding-top:54px}
.leaflet-bar a{background:var(--bg-3);color:var(--ink);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--bg-4);color:var(--ink)}

.pinWrap{background:none !important;border:0 !important}
.pin{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;border:2px solid var(--line-2);background:var(--bg-3);
  box-shadow:0 3px 10px rgba(0,0,0,.6);position:relative;
}
.pin.combat{border-color:#b8574e;background:#2a1a19}
.pin.treasure{border-color:var(--gold);background:#2a2213}
.pin.boss{border-color:#a76fd4;background:#241a30;width:42px;height:42px;font-size:21px}
.pin.landmark{border-color:#4a8fd4;background:#152331}
.pin.cleared{opacity:.42;filter:grayscale(1)}
.pin.inrange{animation:pulse 1.5s infinite}
.pin .diff{
  position:absolute;bottom:-5px;right:-5px;background:var(--bg);border:1px solid var(--line-2);
  border-radius:99px;font-size:9px;padding:0 4px;font-family:var(--mono);font-weight:700;color:var(--ink-2);
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(224,163,62,.55)}
  70%{box-shadow:0 0 0 14px rgba(224,163,62,0)}
  100%{box-shadow:0 0 0 0 rgba(224,163,62,0)}
}
.playerPin{
  width:20px;height:20px;border-radius:50%;
  background:#4a8fd4;border:3px solid #cfe4fb;box-shadow:0 0 14px rgba(74,143,212,.9);
}
.leaflet-popup-content-wrapper{background:var(--bg-2);color:var(--ink);border:1px solid var(--line-2);border-radius:var(--r-lg)}
.leaflet-popup-tip{background:var(--bg-2);border:1px solid var(--line-2)}
.leaflet-popup-content{margin:11px 13px;font-size:13px}
.popTitle{font-weight:700;margin-bottom:2px}
.popMeta{font-size:11.5px;color:var(--ink-3);margin-bottom:8px}

/* ---------- 6. Modals ---------- */
.modalBack{
  position:absolute;inset:0;z-index:1000;background:rgba(5,7,11,.82);
  display:flex;align-items:center;justify-content:center;padding:14px;
  backdrop-filter:blur(3px);animation:fin .18s ease;
}
@keyframes fin{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;
  box-shadow:var(--shadow);animation:min .22s cubic-bezier(.2,.9,.3,1);
}
@keyframes min{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal.lg{max-width:760px}
.modalHead{
  display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--bg-2);z-index:2;border-radius:14px 14px 0 0;
}
.modalHead h3{font-size:16px;flex:1}
.modalBody{padding:16px}
.modalFoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.closeX{width:30px;height:30px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-3);padding:0;font-size:15px;line-height:1}

/* ---------- 7. Combat ---------- */
#combatScreen{
  position:absolute;inset:0;z-index:1200;display:flex;flex-direction:column;
  background:
    radial-gradient(900px 420px at 50% 0%,rgba(200,69,60,.14),transparent 62%),
    linear-gradient(180deg,#0e1017,#0b0e14);
}
.cbHead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cbHead h3{font-size:15px;flex:1}
.cbEnemies{padding:14px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:none;max-height:38vh}
.enemy{
  display:flex;align-items:center;gap:11px;padding:10px 12px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-lg);
  transition:.15s;
}
.enemy.dead{opacity:.32;filter:grayscale(1)}
.enemy.target{border-color:var(--blood);background:linear-gradient(90deg,rgba(200,69,60,.14),var(--bg-2))}
.enemy.hit{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.enemy .face{width:38px;height:38px;border-radius:var(--r);display:grid;place-items:center;font-size:21px;background:var(--bg-4);flex:none}
.enemy .info{flex:1;min-width:0}
.enemy .info .top{display:flex;align-items:baseline;gap:7px}
.enemy .info b{font-size:13.5px}
.enemy .track{height:7px;margin-top:5px}
.enemy .hpnum{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:3px}

.cbLogWrap{flex:1;overflow-y:auto;padding:0 14px;min-height:60px;display:flex;flex-direction:column;justify-content:flex-end}
.cbLog{display:flex;flex-direction:column;gap:4px;padding-bottom:10px}
.logLine{font-size:12.5px;padding:5px 9px;border-radius:var(--r);background:var(--bg-2);border-left:2px solid var(--line-2)}
.logLine.you{border-left-color:var(--mana)}
.logLine.foe{border-left-color:var(--blood)}
.logLine.sys{border-left-color:var(--gold);color:var(--ink-2)}
.logLine.crit{border-left-color:var(--gold);background:rgba(224,163,62,.1);font-weight:600}

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
"use strict";
/* ==========================================================================
   STRIDE & SWORD
   A location-based roguelike. Phases 1-3 of the spec, single file, no build.

   Module map (mirrors the component tree in the design doc):
     Utils/StorageService      -> Store
     Utils/APIService          -> API           (scaffolded, local fallback)
     Utils/LocationService     -> Loc
     Utils/CombatCalculator    -> Calc
     Auth/*                    -> Auth + Screens.auth
     CharacterCreation/*       -> Screens.create
     MainGame/Map/*            -> MapView
     MainGame/HUD/*            -> HUD
     MainGame/Combat/*         -> Combat
     MainGame/Node/*           -> Nodes
   ========================================================================== */

/* -------------------------------------------------------------------------
   0. Utilities
   ------------------------------------------------------------------------- */
const $  = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const uid = (p) => (p ? p + "_" : "") +
  Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd  = (a, b) => a + Math.random() * (b - a);
const rndI = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const chance = (pct) => Math.random() * 100 < pct;
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
const nowTs = () => Date.now();

/* Seeded PRNG so a given zone always generates the same node layout. */
function seededRandom(seedStr) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < seedStr.length; i++) {
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return function () {
    h ^= h << 13; h >>>= 0;
    h ^= h >>> 17;
    h ^= h << 5;  h >>>= 0;
    return h / 4294967296;
  };
}

/* Geo helpers ------------------------------------------------------------ */
const EARTH_R = 6371000; // metres
const toRad = (d) => d * Math.PI / 180;
const toDeg = (r) => r * 180 / Math.PI;

/** Great-circle distance in metres between two {lat,lng}-ish points. */
function haversine(lat1, lon1, lat2, lon2) {
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return 2 * EARTH_R * Math.asin(Math.min(1, Math.sqrt(a)));
}

/** Project a point `dist` metres from origin along `bearing` degrees. */
function projectPoint(lat, lng, dist, bearingDeg) {
  const br = toRad(bearingDeg), d = dist / EARTH_R;
  const la1 = toRad(lat), lo1 = toRad(lng);
  const la2 = Math.asin(Math.sin(la1) * Math.cos(d) + Math.cos(la1) * Math.sin(d) * Math.cos(br));
  const lo2 = lo1 + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(la1),
                               Math.cos(d) - Math.sin(la1) * Math.sin(la2));
  return { latitude: toDeg(la2), longitude: ((toDeg(lo2) + 540) % 360) - 180 };
}

const fmtDist = (m) => m == null ? "--" : (m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2) + " km");

/* -------------------------------------------------------------------------
   1. StorageService
   localStorage-backed, with a transparent in-memory fallback so the game
   still runs in sandboxed frames / private modes where storage throws.
   ------------------------------------------------------------------------- */
const Store = (function () {
  const mem = Object.create(null);
  let durable = true;
  try {
    const probe = "__ss_probe__";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
  } catch (e) { durable = false; }

  function raw(key) {
    if (durable) { try { return localStorage.getItem(key); } catch (e) { durable = false; } }
    return key in mem ? mem[key] : null;
  }
  function setRaw(key, val) {
    mem[key] = val;
    if (durable) {
      try { localStorage.setItem(key, val); }
      catch (e) {
        durable = false;
        console.warn("[Store] localStorage unavailable, using memory:", e && e.message);
      }
    }
  }
  return {
    get isDurable() { return durable; },
    get(key, fallback) {
      const v = raw(key);
      if (v == null) return fallback === undefined ? null : fallback;
      try { return JSON.parse(v); }
      catch (e) { console.warn("[Store] corrupt key", key); return fallback === undefined ? null : fallback; }
    },
    set(key, value) { setRaw(key, JSON.stringify(value)); return value; },
    patch(key, mutator) {
      const cur = this.get(key, {}) || {};
      mutator(cur);
      return this.set(key, cur);
    },
    remove(key) {
      delete mem[key];
      if (durable) { try { localStorage.removeItem(key); } catch (e) {} }
    },
    /* Session (tab-scoped) values, same fallback story. */
    session: {
      get(key, fb) {
        try { const v = sessionStorage.getItem(key); return v == null ? (fb ?? null) : JSON.parse(v); }
        catch (e) { return key in mem ? JSON.parse(mem["__s_" + key] || "null") : (fb ?? null); }
      },
      set(key, val) {
        mem["__s_" + key] = JSON.stringify(val);
        try { sessionStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
      },
      remove(key) {
        delete mem["__s_" + key];
        try { sessionStorage.removeItem(key); } catch (e) {}
      }
    },
    usageBytes() {
      let n = 0;
      try { for (const k in localStorage) if (Object.prototype.hasOwnProperty.call(localStorage, k)) n += (localStorage[k] || "").length; }
      catch (e) {}
      return n;
    }
  };
})();

/* Canonical localStorage keys, per the storage strategy in the design doc. */
const K = {
  session:     "user_session",
  accounts:    "accounts",
  characters:  "characters",
  zones:       "zones",
  nodes:       "nodes",
  inventories: "inventories",
  encounters:  "encounters",
  settings:    "settings",
  walk:        "walk_stats"
};

/* -------------------------------------------------------------------------
   2. APIService  (scaffolded)
   Every persistence call in the game goes through API.request(). Today it
   short-circuits to the localStorage handlers below. Point BASE_URL at a
   deployed backend and `isOnline` flips: the same call sites then hit
   real endpoints, with localStorage as the offline fallback.

   Endpoints the backend must implement (Phase 5):
     POST   /auth/register              POST  /combat/start
     POST   /auth/login                 POST  /combat/{id}/action
     GET    /user/profile               GET   /combat/{id}
     PATCH  /user/profile               PATCH /combat/{id}/end
     POST   /location/create-zone       POST  /inventory/item/add
     GET    /location/zone/{userId}     DELETE/inventory/item/{itemId}
     POST   /nodes/generate             PATCH /inventory/item/{id}/equip
     GET    /nodes/zone/{zoneId}        GET   /inventory/{characterId}
     PATCH  /nodes/{nodeId}/status      PATCH /character/{id}/experience
     GET    /nodes/{nodeId}/encounters  POST  /character/{id}/levelup
     GET    /leaderboard                GET   /character/{id}/progression
   ------------------------------------------------------------------------- */
const API = (function () {
  const BASE_URL = null; // <-- set to "https://your-host/api" once the backend exists

  class APIService {
    constructor(baseURL) {
      this.baseURL = baseURL || "http://localhost:3000/api";
      this.isOnline = !!baseURL;
      this.log = [];
    }
    getToken() {
      const s = Store.get(K.session, {}) || {};
      return s.token || null;
    }
    async request(endpoint, method = "GET", data = null) {
      this.log.push({ t: nowTs(), method, endpoint });
      if (this.log.length > 200) this.log.shift();

      if (!this.isOnline) return this.handleLocal(endpoint, method, data);

      try {
        const options = {
          method,
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + this.getToken()
          }
        };
        if (data) options.body = JSON.stringify(data);
        const res = await fetch(this.baseURL + endpoint, options);
        if (res.status === 401) { Auth.logout(); return { success: false, message: "Session expired" }; }
        if (!res.ok) return { success: false, message: "HTTP " + res.status };
        return await res.json();
      } catch (err) {
        console.error("API Error:", err);
        return this.handleLocal(endpoint, method, data); // offline fallback
      }
    }
    /* Local mode: resolved by Local.route() below. */
    handleLocal(endpoint, method, data) {
      const out = Local.route(endpoint, method, data);
      if (!out) {
        console.warn("[LOCAL MODE] unhandled " + method + " " + endpoint);
        return { success: false, message: "Not implemented locally" };
      }
      return out;
    }
  }
  return new APIService(BASE_URL);
})();

/* -------------------------------------------------------------------------
   3. Local backend emulation
   The localStorage implementation of every endpoint above. When the real
   backend lands, this module is what gets deleted.
   ------------------------------------------------------------------------- */
const Local = (function () {
  /* Deliberately weak: a stand-in for a real server-side hash. Never ship. */
  function pseudoHash(pw) {
    let h = 5381;
    for (let i = 0; i < pw.length; i++) h = ((h << 5) + h + pw.charCodeAt(i)) | 0;
    return "lh$" + (h >>> 0).toString(16) + "$" + pw.length;
  }

  const routes = [
    ["POST", /^\/auth\/register$/, (m, d) => {
      const accounts = Store.get(K.accounts, {}) || {};
      const taken = Object.values(accounts).some(a =>
        a.username.toLowerCase() === d.username.toLowerCase());
      if (taken) return { success: false, message: "That username is already taken." };
      const userId = uid("usr");
      accounts[userId] = {
        userId, username: d.username, email: d.email || "",
        passwordHash: pseudoHash(d.password),
        createdAt: nowTs(), lastLogin: nowTs()
      };
      Store.set(K.accounts, accounts);
      return { success: true, user: publicUser(accounts[userId]), token: "local." + userId };
    }],

    ["POST", /^\/auth\/login$/, (m, d) => {
      const accounts = Store.get(K.accounts, {}) || {};
      const acct = Object.values(accounts).find(a =>
        a.username.toLowerCase() === d.username.toLowerCase());
      if (!acct || acct.passwordHash !== pseudoHash(d.password))
        return { success: false, message: "Wrong username or password." };
      acct.lastLogin = nowTs();
      Store.set(K.accounts, accounts);
      return { success: true, user: publicUser(acct), token: "local." + acct.userId };
    }],

    ["GET", /^\/user\/profile$/, () => {
      const s = Store.get(K.session, {}) || {};
      const accounts = Store.get(K.accounts, {}) || {};
      const a = accounts[s.userId];
      return a ? { success: true, user: publicUser(a) } : { success: false, message: "No session" };
    }],

    ["PATCH", /^\/user\/profile$/, (m, d) => {
      const s = Store.get(K.session, {}) || {};
      Store.patch(K.accounts, (acc) => { if (acc[s.userId]) Object.assign(acc[s.userId], d); });
      return { success: true };
    }],

    /* --- characters --- */
    ["POST", /^\/character\/create$/, (m, d) => {
      Store.patch(K.characters, (chars) => { chars[d.characterId] = d; });
      Store.patch(K.inventories, (inv) => { inv[d.characterId] = []; });
      return { success: true, character: d };
    }],
    ["PATCH", /^\/character\/[^/]+$/, (m, d) => {
      Store.patch(K.characters, (chars) => {
        if (chars[m[0].split("/")[2]]) Object.assign(chars[m[0].split("/")[2]], d);
      });
      return { success: true };
    }],
    ["GET", /^\/character\/list\/[^/]+$/, (m) => {
      const userId = m[0].split("/")[3];
      const chars = Store.get(K.characters, {}) || {};
      return { success: true, characters: Object.values(chars).filter(c => c.userId === userId) };
    }],
    ["DELETE", /^\/character\/[^/]+$/, (m) => {
      const id = m[0].split("/")[2];
      Store.patch(K.characters, (c) => { delete c[id]; });
      Store.patch(K.inventories, (i) => { delete i[id]; });
      return { success: true };
    }],

    /* --- zones & nodes --- */
    ["POST", /^\/location\/create-zone$/, (m, d) => {
      Store.patch(K.zones, (z) => { z[d.zoneId] = d; });
      return { success: true, zone: d };
    }],
    ["GET", /^\/location\/zone\/[^/]+$/, (m) => {
      const userId = m[0].split("/")[3];
      const zones = Store.get(K.zones, {}) || {};
      return { success: true, zones: Object.values(zones).filter(z => z.userId === userId) };
    }],
    ["POST", /^\/nodes\/generate$/, (m, d) => {
      Store.patch(K.nodes, (all) => { d.nodes.forEach(n => { all[n.nodeId] = n; }); });
      return { success: true, nodes: d.nodes };
    }],
    ["GET", /^\/nodes\/zone\/[^/]+$/, (m) => {
      const zoneId = m[0].split("/")[3];
      const all = Store.get(K.nodes, {}) || {};
      return { success: true, nodes: Object.values(all).filter(n => n.zoneId === zoneId) };
    }],
    ["PATCH", /^\/nodes\/[^/]+\/status$/, (m, d) => {
      const nodeId = m[0].split("/")[2];
      Store.patch(K.nodes, (all) => { if (all[nodeId]) Object.assign(all[nodeId], d); });
      return { success: true };
    }],

    /* --- combat --- */
    ["POST", /^\/combat\/start$/, (m, d) => {
      Store.patch(K.encounters, (e) => { e[d.encounterId] = d; });
      return { success: true, encounter: d };
    }],
    ["PATCH", /^\/combat\/[^/]+\/end$/, (m, d) => {
      const id = m[0].split("/")[2];
      Store.patch(K.encounters, (e) => { if (e[id]) Object.assign(e[id], d); });
      return { success: true };
    }],

    /* --- inventory --- */
    ["GET", /^\/inventory\/[^/]+$/, (m) => {
      const cid = m[0].split("/")[2];
      const inv = Store.get(K.inventories, {}) || {};
      return { success: true, items: inv[cid] || [] };
    }],
    ["POST", /^\/inventory\/item\/add$/, (m, d) => {
      Store.patch(K.inventories, (inv) => {
        if (!inv[d.characterId]) inv[d.characterId] = [];
        inv[d.characterId].push(d.item);
      });
      return { success: true };
    }],
    ["POST", /^\/inventory\/sync$/, (m, d) => {
      Store.patch(K.inventories, (inv) => { inv[d.characterId] = d.items; });
      return { success: true };
    }]
  ];

  function publicUser(a) {
    return { userId: a.userId, username: a.username, email: a.email,
             createdAt: a.createdAt, lastLogin: a.lastLogin };
  }

  return {
    route(endpoint, method, data) {
      for (const [verb, re, fn] of routes) {
        if (verb !== method) continue;
        const m = endpoint.match(re);
        if (m) { m[0] = endpoint; return fn(m, data || {}); }
      }
      return null;
    }
  };
})();

/* -------------------------------------------------------------------------
   4. Auth
   ------------------------------------------------------------------------- */
const Auth = {
  current: null,
  async register(username, email, password) {
    const r = await API.request("/auth/register", "POST", { username, email, password });
    if (r.success) this._startSession(r);
    return r;
  },
  async login(username, password) {
    const r = await API.request("/auth/login", "POST", { username, password });
    if (r.success) this._startSession(r);
    return r;
  },
  _startSession(r) {
    const sess = { sessionId: uid("sess"), userId: r.user.userId, loginTime: nowTs(), token: r.token };
    Store.set(K.session, sess);
    Store.session.set("currentUserId", r.user.userId);
    this.current = r.user;
  },
  restore() {
    const s = Store.get(K.session, null);
    if (!s || !s.userId) return null;
    const accounts = Store.get(K.accounts, {}) || {};
    const a = accounts[s.userId];
    if (!a) { Store.remove(K.session); return null; }
    this.current = { userId: a.userId, username: a.username, email: a.email,
                     createdAt: a.createdAt, lastLogin: a.lastLogin };
    Store.session.set("currentUserId", a.userId);
    return this.current;
  },
  logout() {
    Store.remove(K.session);
    Store.session.remove("currentUserId");
    this.current = null;
    Game.reset();
    Screens.show("auth");
  }
};
/* ==========================================================================
   CONTENT — the authored game database, shared by the game and the editor.

   Three tables, all arrays of plain rows in localStorage:

     content_monsters   what you fight
     content_loot       loot tables: parallel item / percentage lists
     content_items      gear and consumables

   Rarity is one vocabulary across monsters and items, with a colour per tier
   and a multiplier set that scales a monster's authored *base* numbers. Base
   values are what you type; effective values are what the game uses. Nothing
   is ever written back multiplied — the scale is applied on read, so changing
   a multiplier restyles every monster of that rarity at once.
   ========================================================================== */
const Content = (function () {

  const KEYS = {
    monsters: "content_monsters",
    loot:     "content_loot",
    items:    "content_items",
    config:   "content_config"
  };

  /* ---------------------------------------------------------------- rarity */
  const RARITY = {
    common:    { key: "common",    name: "Common",    color: "#9aa7ba", order: 0 },
    uncommon:  { key: "uncommon",  name: "Uncommon",  color: "#5fae67", order: 1 },
    rare:      { key: "rare",      name: "Rare",      color: "#4a8fd4", order: 2 },
    epic:      { key: "epic",      name: "Epic",      color: "#a76fd4", order: 3 },
    legendary: { key: "legendary", name: "Legendary", color: "#e0a33e", order: 4 },
    mythic:    { key: "mythic",    name: "Mythic",    color: "#e05c5c", order: 5 }
  };
  const RARITY_ORDER = ["common", "uncommon", "rare", "epic", "legendary", "mythic"];

  /* Monster scaling per rarity. Editable from the editor's Rarity tab.
     lootRolls is extra rolls of the monster's loot table; lootTilt biases
     which tier of item a procedural fallback drop lands on. */
  const DEFAULT_SCALE = {
    common:    { hp: 1.00, dmg: 1.00, armor: 1.00, exp: 1.0, lootRolls: 0, lootTilt: 1.00 },
    uncommon:  { hp: 1.18, dmg: 1.12, armor: 1.10, exp: 1.3, lootRolls: 0, lootTilt: 1.15 },
    rare:      { hp: 1.45, dmg: 1.28, armor: 1.25, exp: 1.8, lootRolls: 1, lootTilt: 1.35 },
    epic:      { hp: 1.90, dmg: 1.50, armor: 1.45, exp: 2.8, lootRolls: 1, lootTilt: 1.60 },
    legendary: { hp: 2.60, dmg: 1.80, armor: 1.70, exp: 4.5, lootRolls: 2, lootTilt: 2.00 },
    mythic:    { hp: 3.60, dmg: 2.20, armor: 2.00, exp: 7.0, lootRolls: 3, lootTilt: 2.60 }
  };

  const MONSTER_TYPES = ["beast", "humanoid", "creature", "undead", "elemental",
                         "construct", "aberration", "dragon", "spirit", "plant"];

  const DAMAGE_TYPES = ["physical", "slashing", "piercing", "blunt", "fire", "frost",
                        "lightning", "poison", "arcane", "shadow", "holy"];

  /* Damage types the game resolves against magic defence rather than armour. */
  const MAGIC_DAMAGE = ["fire", "frost", "lightning", "arcane", "shadow", "holy", "poison"];

  /* ------------------------------------------------------------- gear slots
     gameType maps an authored slot onto the three equipment slots the game
     actually has, so authored gear is equippable without further work. */
  const GEAR_SLOTS = [
    { key: "helm",     label: "Helm",      gameType: "armor",      icon: "helm" },
    { key: "shoulder", label: "Shoulders", gameType: "armor",      icon: "shoulder" },
    { key: "chest",    label: "Chest",     gameType: "armor",      icon: "chest" },
    { key: "clothing", label: "Clothing",  gameType: "armor",      icon: "cloth" },
    { key: "gloves",   label: "Gloves",    gameType: "armor",      icon: "gloves" },
    { key: "belt",     label: "Belt",      gameType: "armor",      icon: "belt" },
    { key: "legs",     label: "Legs",      gameType: "armor",      icon: "legs" },
    { key: "boots",    label: "Boots",     gameType: "armor",      icon: "boots" },
    { key: "cloak",    label: "Cloak",     gameType: "armor",      icon: "cloak" },
    { key: "shield",   label: "Shield",    gameType: "armor",      icon: "shield" },
    { key: "sword",    label: "Sword",     gameType: "weapon",     icon: "sword" },
    { key: "axe",      label: "Axe",       gameType: "weapon",     icon: "axe" },
    { key: "mace",     label: "Mace",      gameType: "weapon",     icon: "mace" },
    { key: "dagger",   label: "Dagger",    gameType: "weapon",     icon: "dagger" },
    { key: "spear",    label: "Spear",     gameType: "weapon",     icon: "spear" },
    { key: "bow",      label: "Bow",       gameType: "weapon",     icon: "bow" },
    { key: "staff",    label: "Staff",     gameType: "weapon",     icon: "staff" },
    { key: "wand",     label: "Wand",      gameType: "weapon",     icon: "wand" },
    { key: "ring",     label: "Ring",      gameType: "trinket",    icon: "ring" },
    { key: "amulet",   label: "Amulet",    gameType: "trinket",    icon: "amulet" },
    { key: "gem",      label: "Gem",       gameType: "trinket",    icon: "gem" },
    { key: "potion",   label: "Potion",    gameType: "potion",     icon: "potion" },
    { key: "scroll",   label: "Scroll",    gameType: "consumable", icon: "scroll" },
    { key: "tome",     label: "Tome",      gameType: "quest",      icon: "tome" }
  ];

  /* ------------------------------------------------------------------ icons
     24 originals on a 24px grid. Stroked with currentColor so a rarity colour
     tints them, with a little fill for weight. */
  const ICONS = {
    sword:    '<path d="M20 3.5 12.5 11l-1.4-1.4L18.6 2H21z"/><path d="M11.8 10.2 5 17v2h2l6.8-6.8"/><path d="m4 20 1.6-1.6M9.2 12.6l2.2 2.2"/>',
    axe:      '<path d="M5.6 20.8 13.1 13.3"/><path d="M13.5 12.9 9.3 8.7l4.4-4.4a2.9 2.9 0 0 1 4.1 0l.3.3a2.9 2.9 0 0 1 0 4.1z"/><path d="m7.4 15.2 2.6 2.6"/>',
    mace:     '<path d="M3.5 20.5 11 13"/><circle cx="15" cy="9" r="4.6"/><path d="M15 1.6v2.6M15 13.8v2.6M8.2 9h2.2M19.6 9h2.6"/>',
    dagger:   '<path d="M12 2.4 15.6 10.6H8.4z"/><path d="M5.8 12.2h12.4"/><path d="M12 12.2v5"/><circle cx="12" cy="19" r="1.7"/>',
    spear:    '<path d="M12 1.8c1 1.4 1.5 2.5 1.5 3.6S13 7.9 12 9c-1-1.1-1.5-2.3-1.5-3.6S11 3.2 12 1.8Z"/><path d="M12 9v13.2"/><path d="M10.1 10.9h3.8"/>',
    bow:      '<path d="M8 2.6c6.4 3.8 6.4 15 0 18.8"/><path d="M8 2.6v18.8"/><path d="M5.5 12h13"/><path d="m15 8.8 3.4 3.2-3.4 3.2"/>',
    staff:    '<path d="M12 8v13"/><circle cx="12" cy="5" r="3"/><path d="M9.5 11h5"/>',
    wand:     '<path d="M4.2 20.8 12.4 12.6"/><path d="M17.4 2.6 19 6.9 23.2 8.4 19 9.9 17.4 14.2 15.8 9.9 11.6 8.4 15.8 6.9z"/>',
    helm:     '<path d="M5 12a7 7 0 0 1 14 0v5a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M9 12v4M15 12v4M5 14h14"/>',
    shoulder: '<path d="M4 15c0-5 3.6-8 8-8s8 3 8 8v2a2 2 0 0 1-2 2h-3l-1-3H9l-1 3H6a2 2 0 0 1-2-2z"/><path d="M8.5 10.5c2.3-1.3 4.7-1.3 7 0"/>',
    chest:    '<path d="M7 4h10l3 3-2 3v8a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-8L4 7z"/><path d="M12 7v14M8 11h8"/>',
    cloth:    '<path d="M8 3h8l2 4-2 1v13H8V8L6 7z"/><path d="M10 3c0 1.4.9 2 2 2s2-.6 2-2"/>',
    gloves:   '<path d="M7 10V6a1.6 1.6 0 0 1 3.2 0v3M10.2 9V5a1.6 1.6 0 0 1 3.2 0v4M13.4 9.5V7a1.6 1.6 0 0 1 3.2 0v6.5c0 4-2.4 7.5-5.4 7.5S6 17.5 6 14v-3a1.5 1.5 0 0 1 3 0"/>',
    belt:     '<path d="M2 9h20v6H2z"/><path d="M9 9v6M15 9v6"/><path d="M11 11h2v2h-2z"/>',
    legs:     '<path d="M7 3h10l-1 9-1 9h-3l-1-7-1 7H7l-1-9z"/><path d="M6.5 8h11"/>',
    boots:    '<path d="M6 3h5v10l6 3.5c1.2.7 2 1.6 2 2.7V21H6z"/><path d="M6 17h13"/>',
    cloak:    '<path d="M12 3c-3 0-5 1.5-6 4L3 21h18l-3-14c-1-2.5-3-4-6-4Z"/><path d="M9 7c1 2 5 2 6 0"/>',
    shield:   '<path d="M12 2 4 5v7c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V5z"/><path d="M12 7v9M8.5 11.5h7"/>',
    ring:     '<circle cx="12" cy="15" r="6"/><path d="m12 3 2.6 3.4L12 9.8 9.4 6.4z"/>',
    amulet:   '<path d="M6 3c0 6 3 8 6 8s6-2 6-8"/><path d="m12 11 3.5 4-3.5 6-3.5-6z"/>',
    gem:      '<path d="m12 3 6 5-6 13L6 8z"/><path d="M6 8h12M12 3 9 8l3 13M12 3l3 5-3 13"/>',
    potion:   '<path d="M10 3h4v5l3.4 6.2A5 5 0 0 1 13 21h-2a5 5 0 0 1-4.4-6.8L10 8z"/><path d="M9 3h6M7.4 14.5h9.2"/>',
    scroll:   '<path d="M6 4h12v14a3 3 0 0 1-3 3H6a3 3 0 0 0 3-3z"/><circle cx="18" cy="4" r="2.4"/><path d="M9 9h6M9 13h6"/>',
    tome:     '<path d="M4 4h11a3 3 0 0 1 3 3v14H7a3 3 0 0 1-3-3z"/><path d="M4 18a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/>',
    coin:     '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>'
  };
  const ICON_KEYS = Object.keys(ICONS);

  /* ------------------------------------------------------------------ store */
  function read(kind) {
    const v = Store.get(KEYS[kind], null);
    return Array.isArray(v) ? v : [];
  }
  function write(kind, rows) { Store.set(KEYS[kind], rows); return rows; }

  function config() {
    const c = Store.get(KEYS.config, null) || {};
    const scale = {};
    RARITY_ORDER.forEach(r => { scale[r] = Object.assign({}, DEFAULT_SCALE[r], (c.scale || {})[r]); });
    return { scale };
  }
  function saveConfig(c) { Store.set(KEYS.config, c); return c; }

  /* ------------------------------------------------------------- scaling */
  function scaleOf(rarity) {
    const c = config();
    return c.scale[rarity] || c.scale.common;
  }

  /**
   * Authored base numbers -> the numbers the game uses. Never written back:
   * change a multiplier and every monster of that rarity changes with it.
   */
  function effective(m) {
    const s = scaleOf(m.rarity);
    return {
      hp:      Math.max(1, Math.round((+m.baseHp || 1) * s.hp)),
      atkMin:  Math.max(1, Math.round((+m.attackMin || 1) * s.dmg)),
      atkMax:  Math.max(1, Math.round((+m.attackMax || 1) * s.dmg)),
      armor:   Math.max(0, Math.round((+m.armor || 0) * s.armor)),
      exp:     Math.max(0, Math.round((+m.expReward || 0) * s.exp)),
      gold:    Math.max(0, Math.round((+m.goldReward || 0) * s.exp)),
      lootRolls: s.lootRolls,
      lootTilt:  s.lootTilt,
      scale: s
    };
  }

  /* --------------------------------------------------------------- helpers */
  function iconSvg(iconKey, size, color) {
    const body = ICONS[iconKey] || ICONS.gem;
    return '<svg class="gicon" viewBox="0 0 24 24" width="' + (size || 20) + '" height="' + (size || 20) +
      '" fill="none" stroke="' + (color || "currentColor") +
      '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      body + "</svg>";
  }

  /** Icon markup for anything the game shows in a list: authored or procedural. */
  function itemIconHtml(item, size) {
    if (item && item.iconKey && ICONS[item.iconKey]) {
      return iconSvg(item.iconKey, size, rarityColor(item.rarity));
    }
    return '<span class="emojiIcon">' + (item && item.icon ? item.icon : "•") + "</span>";
  }

  function rarityColor(r) { return (RARITY[r] || RARITY.common).color; }
  function rarityName(r)  { return (RARITY[r] || RARITY.common).name; }

  function slotDef(key) { return GEAR_SLOTS.find(s => s.key === key) || GEAR_SLOTS[0]; }

  function newId(prefix) { return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8); }

  /* ------------------------------------------------------------------ CRUD */
  function list(kind) { return read(kind); }
  function get(kind, id) {
    const idKey = kind === "monsters" ? "monsterId" : kind === "loot" ? "lootTableId" : "itemId";
    return read(kind).find(r => r[idKey] === id) || null;
  }
  function save(kind, row) {
    const idKey = kind === "monsters" ? "monsterId" : kind === "loot" ? "lootTableId" : "itemId";
    const rows = read(kind);
    if (!row[idKey]) row[idKey] = newId(kind === "monsters" ? "mon" : kind === "loot" ? "lt" : "itm");
    const i = rows.findIndex(r => r[idKey] === row[idKey]);
    row.updatedAt = Date.now();
    if (i >= 0) rows[i] = row; else { row.createdAt = Date.now(); rows.push(row); }
    write(kind, rows);
    return row;
  }
  function remove(kind, id) {
    const idKey = kind === "monsters" ? "monsterId" : kind === "loot" ? "lootTableId" : "itemId";
    write(kind, read(kind).filter(r => r[idKey] !== id));
  }
  function replaceAll(kind, rows) { return write(kind, rows || []); }

  /* ------------------------------------------------------------- blank rows */
  function blankMonster() {
    return {
      monsterId: "", name: "", icon: "👹", type: "beast", rarity: "common", isBoss: false,
      levelMin: 1, levelMax: 3,
      baseHp: 30, armor: 3,
      attackName: "Strike", attackMin: 4, attackMax: 8, damageType: "physical",
      expReward: 80, goldReward: 20,
      lootTableId: ""
    };
  }
  function blankLootTable() {
    return { lootTableId: "", name: "", loot: [], chances: [], dropsMin: 0, dropsMax: 2 };
  }
  function blankItem() {
    return {
      itemId: "", name: "", gearType: "sword", iconKey: "sword", rarity: "common",
      damageType: "slashing", damageMin: 3, damageMax: 6,
      armor: 0, resistance: 0,
      restoreHp: 0, restoreMana: 0, restoreStamina: 0,
      itemLevel: 1, value: 20, description: ""
    };
  }

  /** Consumables carry their restore amounts as three plain fields. */
  function restoreOf(def) {
    const r = {};
    if (+def.restoreHp)      r.hp = +def.restoreHp;
    if (+def.restoreMana)    r.mana = +def.restoreMana;
    if (+def.restoreStamina) r.stamina = +def.restoreStamina;
    return Object.keys(r).length ? r : null;
  }

  /* --------------------------------------------------------- loot resolution
     Percentages are exactly what you typed: each entry is rolled on its own,
     nothing is normalised. dropsMin / dropsMax then clamp the result — a
     surplus is trimmed at random, a shortfall is topped up by drawing from
     the remaining entries weighted by their own chance. */
  function rollLoot(tableId, opts) {
    opts = opts || {};
    const t = get("loot", tableId);
    if (!t || !t.loot || !t.loot.length) return [];
    const luckBonus = (opts.luck || 0) * 0.35;   // percentage points, not a multiplier
    const won = [], lost = [];

    t.loot.forEach((itemId, i) => {
      const pct = Number(t.chances[i]) || 0;
      if (Math.random() * 100 < pct + luckBonus) won.push({ itemId, pct });
      else lost.push({ itemId, pct });
    });

    const min = Math.max(0, Number(t.dropsMin) || 0);
    const max = Math.max(min, Number(t.dropsMax) != null ? Number(t.dropsMax) : min);

    while (won.length > max) won.splice(Math.floor(Math.random() * won.length), 1);
    while (won.length < min && lost.length) {
      const total = lost.reduce((s, e) => s + Math.max(0.0001, e.pct), 0);
      let r = Math.random() * total, k = 0;
      for (; k < lost.length; k++) { r -= Math.max(0.0001, lost[k].pct); if (r <= 0) break; }
      won.push(lost.splice(Math.min(k, lost.length - 1), 1)[0]);
    }
    return won.map(w => w.itemId);
  }

  /* ------------------------------------------- authored row -> game instance */
  function toGameItem(def, level) {
    if (typeof def === "string") def = get("items", def);
    if (!def) return null;
    const slot = slotDef(def.gearType);
    const dmgMin = +def.damageMin || 0, dmgMax = +def.damageMax || 0;
    const stats = {};
    if (slot.gameType === "weapon") stats.damage = Math.max(1, Math.round((dmgMin + dmgMax) / 2));
    if (+def.armor) stats.defense = +def.armor;
    if (+def.resistance) stats.resistance = +def.resistance;

    const restore = restoreOf(def);
    const parts = [];
    if (stats.damage) parts.push(dmgMin + "–" + dmgMax + " " + def.damageType);
    if (stats.defense) parts.push("+" + stats.defense + " DEF");
    if (stats.resistance) parts.push("+" + stats.resistance + " RES");
    if (restore) for (const k in restore) parts.push("+" + restore[k] + " " + k.toUpperCase());

    return {
      itemId: newId("inst"), defId: def.itemId, name: def.name,
      type: slot.gameType === "consumable" || slot.gameType === "quest" ? "potion" : slot.gameType,
      gearType: def.gearType, iconKey: def.iconKey, icon: null,
      rarity: def.rarity, level: +def.itemLevel || level || 1,
      damageType: def.damageType, dmgMin, dmgMax,
      stats, restore,
      effect: parts.join("  ") || (def.description ? "" : "No bonuses"),
      description: def.description || "",
      price: +def.value || 10, quantity: 1, authored: true
    };
  }

  /**
   * Turn an authored monster into the enemy shape the combat engine expects.
   * Level is drawn from the authored range, nudged by how hard the node is.
   */
  function toEnemy(def, nodeDifficulty, playerLevel) {
    const eff = effective(def);
    const lo = Math.min(+def.levelMin || 1, +def.levelMax || 1);
    const hi = Math.max(+def.levelMin || 1, +def.levelMax || 1);
    const want = Math.round(((nodeDifficulty || 1) * 0.85 + (playerLevel || 1) * 0.28));
    const level = Math.max(lo, Math.min(hi, want || lo));
    // Authored numbers describe the monster at the BOTTOM of its level band.
    // It then gains 15% per level above that, so a level-20 specimen of a
    // 12–20 monster is roughly twice the level-12 one.
    const growth = 1 + Math.max(0, level - lo) * 0.15;

    const hp = Math.max(1, Math.round(eff.hp * growth));
    const atkMin = Math.max(1, Math.round(eff.atkMin * growth));
    const atkMax = Math.max(atkMin, Math.round(eff.atkMax * growth));
    const magic = MAGIC_DAMAGE.indexOf(def.damageType) >= 0;

    return {
      enemyId: newId("enm"), defId: def.monsterId,
      name: def.name, icon: def.icon || "👹",
      level, boss: !!def.isBoss, authored: true,
      monsterType: def.type, rarity: def.rarity,
      attackName: def.attackName || "Strike", damageType: def.damageType,
      hp, maxHp: hp, alive: true, tempEvasion: 0, slowed: 0,
      attributes: {
        strength: Math.round(atkMax * 0.9), dexterity: Math.round(6 + level * 1.1),
        constitution: Math.round(hp / 8), intelligence: magic ? Math.round(atkMax * 0.8) : 6,
        wisdom: Math.round(5 + level * 0.7), charisma: 8, luck: 8
      },
      // The engine reads atkMin/atkMax in preference to attackPower, so the
      // authored range is what actually lands, before mitigation.
      atkMin, atkMax,
      attackPower: (atkMin + atkMax) / 2,
      spellPower:  (atkMin + atkMax) / 2,
      armor: eff.armor,
      magicDefense: Math.round(eff.armor * 0.8 + level * 1.2),
      accuracy: 74 + level * 1.1,
      evasion: 4 + level * 0.9,
      critChance: 4 + (RARITY[def.rarity] || RARITY.common).order * 2,
      critResist: level * 0.5,
      caster: magic,
      lootTableId: def.lootTableId || "",
      lootRolls: eff.lootRolls,
      rewards: { experience: eff.exp, gold: eff.gold, items: [] }
    };
  }

  /** Authored monsters that fit this node, or [] to fall back to the built-ins. */
  function monstersFor(node, playerLevel) {
    const all = read("monsters").filter(m => m.name);
    if (!all.length) return [];
    const want = Math.round(((node.difficulty || 1) * 0.85 + (playerLevel || 1) * 0.28)) || 1;
    const boss = node.type === "boss";
    let pool = all.filter(m => !!m.isBoss === boss &&
      want >= (+m.levelMin || 1) - 1 && want <= (+m.levelMax || 99) + 1);
    if (!pool.length) pool = all.filter(m => !!m.isBoss === boss);
    if (!pool.length) pool = all;
    return pool;
  }

  /* ------------------------------------------------------------ import/export */
  function exportAll() {
    return {
      format: "stride-and-sword.content",
      version: 1,
      exportedAt: new Date().toISOString(),
      config: config(),
      tables: { monsters: read("monsters"), loot: read("loot"), items: read("items") }
    };
  }
  function importAll(json, mode) {
    if (!json || !json.tables) return { success: false, message: "Not a content file." };
    ["monsters", "loot", "items"].forEach(kind => {
      const incoming = json.tables[kind] || [];
      if (mode === "replace") { write(kind, incoming); return; }
      const idKey = kind === "monsters" ? "monsterId" : kind === "loot" ? "lootTableId" : "itemId";
      const rows = read(kind);
      incoming.forEach(row => {
        const i = rows.findIndex(r => r[idKey] === row[idKey]);
        if (i >= 0) rows[i] = row; else rows.push(row);
      });
      write(kind, rows);
    });
    if (json.config) saveConfig(json.config);
    return { success: true,
             monsters: read("monsters").length, loot: read("loot").length, items: read("items").length };
  }

  function stats() {
    return { monsters: read("monsters").length, loot: read("loot").length, items: read("items").length };
  }
  function isEmpty() { const s = stats(); return !s.monsters && !s.loot && !s.items; }
  function clearAll() { ["monsters", "loot", "items"].forEach(k => Store.remove(KEYS[k])); }

  return {
    KEYS, RARITY, RARITY_ORDER, DEFAULT_SCALE, MONSTER_TYPES, DAMAGE_TYPES, MAGIC_DAMAGE,
    GEAR_SLOTS, ICONS, ICON_KEYS,
