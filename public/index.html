  boss:     ["The Long Corridor","Rooftop Access","The Deep Stairwell","Far Parking Deck"],
  landmark: ["Quiet Fountain","Sunlit Bench","Old Oak","Coffee Cart","Memorial Stone"]
};

/* -------------------------------------------------------------------------
   6. CombatCalculator — all derived stats and damage maths
   ------------------------------------------------------------------------- */
const Calc = {
  /** Effective attributes = base (already includes race mods) + equipment. */
  effectiveAttrs(ch) {
    const a = Object.assign({}, ch.attributes);
    for (const it of (ch.equipment || [])) {
      if (it && it.stats && it.stats.bonusAttribute) {
        for (const k in it.stats.bonusAttribute) a[k] = (a[k] || 0) + it.stats.bonusAttribute[k];
      }
    }
    return a;
  },
  maxHp(ch) {
    const a = this.effectiveAttrs(ch), c = CLASSES[ch.class];
    return Math.round((44 + a.constitution * 6.5 + a.strength * 1.6 + (ch.level - 1) * 13) * c.hpMul);
  },
  maxMana(ch) {
    const a = this.effectiveAttrs(ch), c = CLASSES[ch.class];
    return Math.round((14 + a.intelligence * 4.4 + a.wisdom * 1.8 + (ch.level - 1) * 6) * c.mpMul);
  },
  maxStamina(ch) {
    const a = this.effectiveAttrs(ch), c = CLASSES[ch.class];
    return Math.round((46 + a.constitution * 3 + a.dexterity * 2.4 + (ch.level - 1) * 5) * c.spMul);
  },
  weaponDamage(ch) {
    const w = (ch.equipment || []).find(i => i && i.type === "weapon");
    return w ? (w.stats.damage || 0) : 2; // bare fists
  },
  armor(ch) {
    const a = this.effectiveAttrs(ch);
    let def = a.constitution * 0.55;
    for (const it of (ch.equipment || [])) if (it && it.stats && it.stats.defense) def += it.stats.defense;
    return Math.round(def);
  },
  attackPower(ch) {
    const a = this.effectiveAttrs(ch);
    const c = CLASSES[ch.class];
    const boost = c.name === "Warrior" ? 1.2 : c.name === "Rogue" ? 1.05 : 0.85;
    return (a.strength * 1.15 + a.dexterity * 0.55 + this.weaponDamage(ch) * 1.6) * boost;
  },
  spellPower(ch) {
    const a = this.effectiveAttrs(ch);
    const c = CLASSES[ch.class];
    const boost = c.name === "Mage" ? 1.35 : 0.8;
    return (a.intelligence * 1.45 + a.wisdom * 0.5 + this.weaponDamage(ch) * 0.7) * boost;
  },
  accuracy(ch)   { const a = this.effectiveAttrs(ch); return 74 + a.dexterity * 1.5 + a.luck * 0.4; },
  evasion(ch)    { const a = this.effectiveAttrs(ch); return a.dexterity * 1.35 + a.luck * 0.45; },
  critChance(ch) {
    const a = this.effectiveAttrs(ch);
    const base = 4 + a.luck * 0.85 + a.dexterity * 0.32;
    return clamp(base + (ch.class === "Rogue" ? 7 : 0), 0, 70);
  },
  critResist(ch) { const a = this.effectiveAttrs(ch); return a.wisdom * 0.65; },
  magicDefense(ch) {
    const a = this.effectiveAttrs(ch);
    let res = 0;
    for (const it of (ch.equipment || [])) if (it && it.stats && it.stats.resistance) res += it.stats.resistance;
    return a.wisdom * 1.25 + a.intelligence * 0.35 + res;
  },
  initiative(ch) { const a = this.effectiveAttrs(ch); return a.dexterity * 2 + a.luck * 0.5 + rnd(0, 8); },
  priceMod(ch)   { const a = this.effectiveAttrs(ch); return clamp(1 - (a.charisma - 10) * 0.02, 0.6, 1.4); },

  /** Mitigation curve: armour has diminishing returns, never full immunity. */
  mitigate(raw, defence) { return Math.max(1, raw * (100 / (100 + Math.max(0, defence)))); },

  xpForLevel(level) { return 1000 + (level - 1) * 450; },

  /** One attack resolution. Returns {hit, crit, damage}. */
  resolveHit(atk, def, opts) {
    opts = opts || {};
    const acc = (atk.accuracy || 80) + (opts.accBonus || 0);
    const evd = (def.evasion || 0) + (def.tempEvasion || 0);
    const hitChance = clamp(acc - evd * 0.75, 22, 96);
    if (!chance(hitChance)) return { hit: false, crit: false, damage: 0 };

    const critC = clamp((atk.critChance || 5) + (opts.critBonus || 0) - (def.critResist || 0), 0, 92);
    const crit = opts.guaranteedCrit || chance(critC);

    const defence = opts.kind === "magic" ? def.magicDefense : def.armor;
    let raw;
    if (atk.atkMin != null && atk.atkMax != null) {
      // An authored monster states its damage range outright, so use it as
      // written rather than deriving a figure from attributes.
      raw = rnd(atk.atkMin, atk.atkMax) * (opts.mult || 1);
    } else {
      const power = opts.kind === "magic" ? atk.spellPower : atk.attackPower;
      raw = power * (opts.mult || 1) * rnd(0.86, 1.14);
    }
    if (crit) raw *= 1.85;
    return { hit: true, crit, damage: Math.max(1, Math.round(this.mitigate(raw, defence))) };
  }
};

/* -------------------------------------------------------------------------
   7. Item generation
   ------------------------------------------------------------------------- */
const Items = {
  rollRarity(luck, difficulty) {
    const tilt = 1 + (luck - 10) * 0.045 + (difficulty || 1) * 0.05;
    const entries = Object.entries(RARITY).map(([k, v]) => {
      const rareness = ["common","uncommon","rare","epic","legendary"].indexOf(k);
      return [k, v.weight * Math.pow(tilt, rareness)];
    });
    const total = entries.reduce((s, e) => s + e[1], 0);
    let r = Math.random() * total;
    for (const [k, w] of entries) { r -= w; if (r <= 0) return k; }
    return "common";
  },

  generate(level, luck, difficulty, forceType) {
    const type = forceType || pick(["weapon", "weapon", "armor", "armor", "trinket", "potion"]);
    if (type === "potion") {
      const p = pick(POTIONS);
      return { itemId: uid("itm"), name: p.name, type: "potion", icon: p.icon,
               rarity: "common", level, stats: {}, restore: p.restore,
               effect: Object.entries(p.restore).map(([k, v]) => "+" + v + " " + k.toUpperCase()).join(", "),
               price: p.price, quantity: 1 };
    }
    const rarity = this.rollRarity(luck, difficulty);
    const rm = RARITY[rarity].mult;
    const lvlScale = 1 + (level - 1) * 0.16;

    let baseDef, icon, name, stats = {};
    if (type === "weapon") {
      baseDef = pick(WEAPONS); icon = baseDef.icon;
      stats.damage = Math.max(1, Math.round(baseDef.dmg * rm * lvlScale));
    } else if (type === "armor") {
      baseDef = pick(ARMORS); icon = baseDef.icon;
      stats.defense = Math.max(1, Math.round(baseDef.def * rm * lvlScale));
    } else {
      baseDef = pick(TRINKETS); icon = baseDef.icon;
    }

    const rIdx = ["common","uncommon","rare","epic","legendary"].indexOf(rarity);
    // Trinkets have no damage or defence, so they always carry at least one
    // attribute bonus — otherwise a common trinket would be pure vendor trash.
    if (rIdx >= 1 || type === "trinket") {
      const n = clamp(Math.round(rIdx * 0.9), 1, 3);
      stats.bonusAttribute = {};
      const pool = ATTRS.map(a => a.key);
      const chosen = new Set([baseDef.attr]);
      while (chosen.size < n) chosen.add(pick(pool));
      for (const k of chosen) {
        stats.bonusAttribute[k] = Math.max(1,
          Math.round((1 + rIdx * 0.85) * (0.7 + Math.random() * 0.6) * (1 + (level - 1) * 0.06)));
      }
    }

    name = baseDef.base;
    if (rIdx >= 1) name = pick(PREFIX) + " " + name;
    if (rIdx >= 3) name = name + " " + pick(SUFFIX);

    const price = Math.round((12 + level * 6) * RARITY[rarity].priceMul);
    return { itemId: uid("itm"), name, type, icon, rarity, level, stats,
             effect: this.describe({ type, stats }), price, quantity: 1 };
  },

  describe(it) {
    const parts = [];
    if (it.stats.damage)  parts.push("+" + it.stats.damage + " DMG");
    if (it.stats.defense) parts.push("+" + it.stats.defense + " DEF");
    if (it.stats.bonusAttribute) {
      for (const k in it.stats.bonusAttribute) {
        const a = ATTRS.find(x => x.key === k);
        parts.push("+" + it.stats.bonusAttribute[k] + " " + (a ? a.short : k.slice(0, 3).toUpperCase()));
      }
    }
    if (it.restore) for (const k in it.restore) parts.push("+" + it.restore[k] + " " + k.toUpperCase());
    return parts.join("  ") || "No bonuses";
  },

  slotOf(item) {
    return item.type === "weapon" ? "weapon" : item.type === "armor" ? "armor" :
           item.type === "trinket" ? "trinket" : null;
  }
};

/* -------------------------------------------------------------------------
   8. Enemy generation
   ------------------------------------------------------------------------- */
const Bestiary = {
  spawn(template, difficulty, playerLevel) {
    // Enemies scale mostly with the node's difficulty and only lightly with
    // the player's level — enough to keep low-difficulty nodes from becoming
    // pure filler, not enough to cancel out levelling.
    const lvl = clamp(Math.round(difficulty * 0.85 + playerLevel * 0.28), 1, 40);
    const scale = 1 + (lvl - 1) * 0.15;
    const t = template;
    const attributes = {
      strength: Math.round(t.str * scale), dexterity: Math.round(t.dex * scale),
      constitution: Math.round(t.con * scale), intelligence: Math.round(t.int * scale),
      wisdom: Math.round(t.wis * scale), charisma: 8, luck: 8 + Math.round(difficulty * 0.6)
    };
    const hp = Math.round(t.hp * scale);
    return {
      enemyId: uid("enm"), name: t.name, icon: t.icon, level: lvl, boss: !!t.boss,
      hp, maxHp: hp, attributes, alive: true, tempEvasion: 0, slowed: 0,
      attackPower: attributes.strength * 1.25 + attributes.dexterity * 0.5 + difficulty * 1.4,
      spellPower:  attributes.intelligence * 1.3 + attributes.wisdom * 0.4,
      armor:       Math.round(attributes.constitution * 0.6 + difficulty * 1.1),
      magicDefense:Math.round(attributes.wisdom * 1.1),
      accuracy:    72 + attributes.dexterity * 1.2,
      evasion:     attributes.dexterity * 1.1,
      critChance:  clamp(3 + attributes.luck * 0.6, 0, 45),
      critResist:  attributes.wisdom * 0.5,
      caster:      attributes.intelligence > attributes.strength,
      rewards: {
        experience: Math.round(t.xp * (1 + (lvl - 1) * 0.13)),
        gold: Math.round(t.gold * (1 + (lvl - 1) * 0.15)),
        items: []
      }
    };
  },

  /** Authored monsters win when any of them fit this node; the built-in
      bestiary below is the fallback for an empty content database. */
  packFor(node, playerLevel) {
    const authored = Content.monstersFor(node, playerLevel);
    if (authored.length) return this.packFromAuthored(authored, node, playerLevel);
    return this.packFromBuiltins(node, playerLevel);
  },

  packFromAuthored(pool, node, playerLevel) {
    const d = node.difficulty;
    // A boss site punches above its difficulty number, as it always has.
    const pack = [Content.toEnemy(pick(pool), node.type === "boss" ? d + 3 : d, playerLevel)];
    const extra = clamp(Math.floor(d / 4), 0, 2);
    if (node.type === "boss") {
      const adds = Content.monstersFor({ type: "combat", difficulty: Math.max(1, d - 2) }, playerLevel);
      for (let i = 0; i < extra && adds.length; i++) pack.push(Content.toEnemy(pick(adds), Math.max(1, d - 2), playerLevel));
    } else {
      for (let i = 0; i < extra; i++) pack.push(Content.toEnemy(pick(pool), d, playerLevel));
    }
    return pack;
  },

  packFromBuiltins(node, playerLevel) {
    const d = node.difficulty;
    if (node.type === "boss") {
      const pool = BOSSES.filter(b => b.tier <= Math.ceil(d / 3) + 1);
      const boss = pick(pool.length ? pool : [BOSSES[0]]);
      const pack = [this.spawn(boss, d + 2, playerLevel)];
      const adds = clamp(Math.floor(d / 4), 0, 2);
      const minions = BESTIARY.filter(b => b.tier <= Math.ceil(d / 3));
      for (let i = 0; i < adds; i++) pack.push(this.spawn(pick(minions.length ? minions : BESTIARY), d - 2, playerLevel));
      return pack;
    }
    const tierCap = clamp(Math.ceil(d / 3), 1, 4);
    const pool = BESTIARY.filter(b => b.tier <= tierCap && b.tier >= Math.max(1, tierCap - 2));
    const use = pool.length ? pool : BESTIARY.slice(0, 3);
    const count = clamp(1 + Math.floor(d / 4), 1, 3);
    const pack = [];
    for (let i = 0; i < count; i++) pack.push(this.spawn(pick(use), d, playerLevel));
    return pack;
  }
};
/* -------------------------------------------------------------------------
   8b. The Atlas — a JSON name database for the real world around you

   Two tables, both keyed by coordinate:

     atlas_buildings  "41.88270,-87.62330" -> { key, name, kind, ... }
     atlas_streets    "41.88301,-87.62410" -> { key, name, realName, ... }

   Buildings are keyed by their footprint centroid, streets by the midpoint of
   the OSM way that carries them. Names are generated from a seed derived from
   the key, so the same doorway is always the same tavern — on this device, on
   a reload, and on any other device given the same coordinates.

   Streets are a special case: one real street is many OSM ways, so the fantasy
   name is seeded from the *real* street name (when there is one) rather than
   the coordinate. Every segment of "W Adams St" therefore reads as the same
   fantasy road, while each segment still gets its own row keyed by position.
   ------------------------------------------------------------------------- */
const Atlas = (function () {
  const KEY_B = "atlas_buildings";
  const KEY_S = "atlas_streets";

  /* ---- word banks ---- */
  const ST_FIRST = ["Ash","Copper","Grim","Long","Old","Silver","Thorn","Ember","Hollow","Raven",
                    "Iron","Mist","Cinder","Bram","Fen","Gallow","Quill","Amber","Stone","Wither",
                    "Kettle","Rook","Salt","Tallow","Vellum","Wren","Harrow","Marl","Pike","Bell"];
  const ST_SECOND = ["wind","gate","fall","mere","barrow","hollow","reach","watch","ford","cross",
                     "march","stead","holt","vale","bourne","wick","moor","spire","gild","haven"];
  const ST_KIND   = ["Way","Row","Lane","Mile","Path","Rise","Walk","Steps","Causeway","Crossing",
                     "Passage","Run","Close","Reach","Bend"];
  const ST_THE    = ["The Long Mile","The Crooked Mile","The Ashen Walk","The Quiet Crossing",
                    "The Pilgrim's Road","The Drover's Path","The Old Processional","The Coalway",
                    "The Lamplighter's Round","The Sunken Steps"];

  const B_ADJ  = ["Gilded","Crooked","Quiet","Weeping","Brazen","Hollow","Salted","Guttering","Patient",
                  "Wayward","Iron","Blessed","Rusted","Amber","Nameless","Drowned","Laughing","Grey",
                  "Wandering","Threadbare","Tallow","Bitter","Sable","Copper"];
  const B_NOUN = ["Ledger","Tankard","Lantern","Anvil","Bell","Key","Hound","Crown","Cask","Sparrow",
                  "Thimble","Compass","Kettle","Hearth","Reliquary","Lark","Gate","Coin","Wheel",
                  "Chandler","Cellar","Vault","Loom","Quill"];
  const B_PERSON = ["Maugrim","Ottoline","Bram","Cassilda","Hollis","Ingrid","Jory","Kestrel","Lund",
                    "Mirren","Nevin","Osric","Peregrine","Quillon","Rhosyn","Sable","Tamsin","Ulric",
                    "Varda","Wend","Yarrow","Zeph"];
  const B_PLURAL = ["Quiet Bells","Small Mercies","Long Accounts","Borrowed Hours","Nine Locks",
                    "Grey Petitions","Wintering Birds","Kept Promises","Idle Hands","Twelve Windows"];

  /* Building kinds, chosen from OSM tags first and footprint size second. */
  const KINDS = {
    tavern:     { label: "tavern",        icon: "🍺", color: "#c98a3a" },
    smithy:     { label: "smithy",        icon: "🔨", color: "#c2603f" },
    temple:     { label: "temple",        icon: "⛪", color: "#8f6fd0" },
    tower:      { label: "tower",         icon: "🗼", color: "#5f8fd0" },
    market:     { label: "market stall",  icon: "🧺", color: "#c9a63a" },
    guildhall:  { label: "guild hall",    icon: "🏛️", color: "#7f9fc0" },
    keep:       { label: "keep",          icon: "🏰", color: "#8899b0" },
    cottage:    { label: "cottage",       icon: "🏚️", color: "#9a7f5f" },
    apothecary: { label: "apothecary",    icon: "⚗️", color: "#5fae8f" },
    library:    { label: "library",       icon: "📚", color: "#6f8fd0" },
    granary:    { label: "granary",       icon: "🌾", color: "#b09a4a" },
    stable:     { label: "stable",        icon: "🐎", color: "#8a7a5a" },
    foundry:    { label: "foundry",       icon: "⚒️", color: "#b0563f" },
    bathhouse:  { label: "bathhouse",     icon: "♨️", color: "#5f9fae" },
    barracks:   { label: "barracks",      icon: "🛡️", color: "#7a8a9a" },
    counting:   { label: "counting house",icon: "🪙", color: "#c9a63a" }
  };

  /* OSM building=* / amenity=* -> fantasy kind */
  const TAG_KIND = {
    church: "temple", cathedral: "temple", chapel: "temple", mosque: "temple",
    synagogue: "temple", temple: "temple", shrine: "temple", religious: "temple",
    school: "library", university: "library", college: "library", library: "library",
    kindergarten: "library",
    hospital: "apothecary", clinic: "apothecary", pharmacy: "apothecary",
    retail: "market", shop: "market", supermarket: "market", kiosk: "market",
    commercial: "counting", office: "counting", bank: "counting",
    industrial: "foundry", warehouse: "foundry", manufacture: "foundry", factory: "foundry",
    garage: "stable", garages: "stable", carport: "stable", parking: "stable",
    hotel: "tavern", restaurant: "tavern", bar: "tavern", pub: "tavern", cafe: "tavern",
    barn: "granary", farm: "granary", greenhouse: "granary", silo: "granary",
    civic: "guildhall", government: "guildhall", public: "guildhall", townhall: "guildhall",
    hangar: "barracks", fire_station: "barracks", police: "barracks",
    tower: "tower", water_tower: "tower", mast: "tower",
    house: "cottage", detached: "cottage", residential: "cottage", apartments: "cottage",
    bungalow: "cottage", terrace: "cottage", dormitory: "cottage", hut: "cottage",
    sports_centre: "bathhouse", swimming_pool: "bathhouse", stadium: "bathhouse"
  };

  function table(which) {
    return Store.get(which === "buildings" ? KEY_B : KEY_S, {}) || {};
  }
  function writeTable(which, obj) {
    Store.set(which === "buildings" ? KEY_B : KEY_S, obj);
  }

  /** Coordinate key. 5 decimal places ~= 1.1 m, which is finer than any GPS fix. */
  function keyFor(lat, lng) {
    return Number(lat).toFixed(5) + "," + Number(lng).toFixed(5);
  }

  /**
   * Two different features can land on the same coordinate — a street midpoint
   * sitting exactly on a crossroads, say. The key stays the coordinate; a
   * "#2" suffix distinguishes the second tenant so neither row is lost.
   */
  function freeKey(t, lat, lng, osmId) {
    const base = keyFor(lat, lng);
    if (!t[base] || !osmId || !t[base].osmId || t[base].osmId === osmId) return base;
    let n = 2;
    while (t[base + "#" + n] && t[base + "#" + n].osmId !== osmId) n++;
    return base + "#" + n;
  }

  function nameStreet(seed, realName) {
    const r = seededRandom("street:" + seed);
    if (r() < 0.14) return ST_THE[Math.floor(r() * ST_THE.length)];
    const a = ST_FIRST[Math.floor(r() * ST_FIRST.length)];
    const b = ST_SECOND[Math.floor(r() * ST_SECOND.length)];
    const k = ST_KIND[Math.floor(r() * ST_KIND.length)];
    return a + b + " " + k;
  }

  function nameBuilding(seed, kind) {
    const r = seededRandom("bldg:" + seed);
    const roll = r();
    if (roll < 0.42) {
      return "The " + B_ADJ[Math.floor(r() * B_ADJ.length)] + " " + B_NOUN[Math.floor(r() * B_NOUN.length)];
    }
    if (roll < 0.74) {
      return B_PERSON[Math.floor(r() * B_PERSON.length)] + "'s " + cap(KINDS[kind].label);
    }
    if (roll < 0.88) {
      return "House of " + B_PLURAL[Math.floor(r() * B_PLURAL.length)];
    }
    return "The " + B_ADJ[Math.floor(r() * B_ADJ.length)] + " " + cap(KINDS[kind].label);
  }

  /** Pick a fantasy kind from OSM tags, falling back to footprint area. */
  function kindFor(tags, areaM2, seed) {
    tags = tags || {};
    const candidates = [tags.building, tags.amenity, tags.shop && "shop", tags.man_made,
                        tags.leisure, tags.office && "office", tags.tourism];
    for (const c of candidates) {
      if (c && TAG_KIND[c]) return TAG_KIND[c];
    }
    const r = seededRandom("kind:" + seed);
    if (areaM2 < 90)   return r() < 0.5 ? "market" : "cottage";
    if (areaM2 < 260)  return pickFrom(r, ["cottage", "smithy", "apothecary", "tavern", "market"]);
    if (areaM2 < 900)  return pickFrom(r, ["tavern", "guildhall", "smithy", "library", "counting", "bathhouse"]);
    if (areaM2 < 3000) return pickFrom(r, ["guildhall", "granary", "foundry", "barracks", "library"]);
    return pickFrom(r, ["keep", "foundry", "granary", "barracks"]);
  }
  function pickFrom(r, arr) { return arr[Math.floor(r() * arr.length)]; }

  return {
    KINDS,
    keyFor,
    table,

    /** Look a row up, creating and persisting it the first time it is seen. */
    building(lat, lng, meta) {
      const t = table("buildings");
      const key = freeKey(t, lat, lng, meta && meta.osmId);
      if (t[key]) return t[key];
      const kind = kindFor(meta && meta.tags, (meta && meta.area) || 0, key);
      const row = {
        key, coordKey: keyFor(lat, lng), latitude: +lat, longitude: +lng,
        name: nameBuilding(key, kind),
        kind, kindLabel: KINDS[kind].label, icon: KINDS[kind].icon,
        realName: (meta && meta.tags && (meta.tags.name || meta.tags["addr:housename"])) || null,
        address: meta && meta.tags && meta.tags["addr:housenumber"]
          ? (meta.tags["addr:housenumber"] + " " + (meta.tags["addr:street"] || "")).trim() : null,
        osmId: (meta && meta.osmId) || null,
        area: Math.round((meta && meta.area) || 0),
        source: (meta && meta.source) || "osm",
        createdAt: nowTs()
      };
      t[key] = row;
      writeTable("buildings", t);
      return row;
    },

    street(lat, lng, meta) {
      const t = table("streets");
      const key = freeKey(t, lat, lng, meta && meta.osmId);
      if (t[key]) return t[key];
      const realName = (meta && meta.tags && meta.tags.name) || null;
      // Seed from the real street name so every segment shares one fantasy name.
      const seed = realName ? "name:" + realName.toLowerCase() : key;
      const row = {
        key, coordKey: keyFor(lat, lng), latitude: +lat, longitude: +lng,
        name: nameStreet(seed, realName),
        realName,
        kind: (meta && meta.tags && meta.tags.highway) || "path",
        osmId: (meta && meta.osmId) || null,
        lengthM: Math.round((meta && meta.length) || 0),
        source: (meta && meta.source) || "osm",
        createdAt: nowTs()
      };
      t[key] = row;
      writeTable("streets", t);
      return row;
    },

    /** Recorded buildings within `maxM` metres, nearest first. */
    nearBuildings(lat, lng, maxM, excludeKeys) {
      const t = table("buildings");
      const out = [];
      for (const k in t) {
        if (excludeKeys && excludeKeys.has(k)) continue;
        const d = haversine(lat, lng, t[k].latitude, t[k].longitude);
        if (d <= (maxM || 80)) out.push({ row: t[k], d });
      }
      return out.sort((a, b) => a.d - b.d);
    },

    /** Nearest recorded building within `maxM` metres, or null. */
    nearestBuilding(lat, lng, maxM, excludeKeys) {
      return this.nearBuildings(lat, lng, maxM, excludeKeys)[0] || null;
    },

    stats() {
      const b = table("buildings"), s = table("streets");
      const named = {};
      for (const k in s) named[s[k].name] = 1;
      return { buildings: Object.keys(b).length, streetRows: Object.keys(s).length,
               streetNames: Object.keys(named).length };
    },

    /** The whole database, shaped the way a server would return it. */
    export() {
      return {
        format: "stride-and-sword.atlas",
        version: 1,
        exportedAt: new Date().toISOString(),
        keying: "decimal degrees, 5dp, \"lat,lng\"",
        tables: { buildings: table("buildings"), streets: table("streets") }
      };
    },

    import(json) {
      if (!json || !json.tables) return { success: false, message: "Not an atlas file." };
      const b = Object.assign(table("buildings"), json.tables.buildings || {});
      const s = Object.assign(table("streets"), json.tables.streets || {});
      writeTable("buildings", b);
      writeTable("streets", s);
      return { success: true, buildings: Object.keys(b).length, streets: Object.keys(s).length };
    },

    clear() { Store.remove(KEY_B); Store.remove(KEY_S); }
  };
})();

/* -------------------------------------------------------------------------
   8c. OSM — real road and building geometry, drawn as a fantasy town

   Geometry comes from the Overpass API (OpenStreetMap's query service). Every
   way it returns is registered in the Atlas, so the fantasy names are stable
   and inspectable rather than being invented at render time.
   ------------------------------------------------------------------------- */
const OSM = {
  ENDPOINTS: [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"
  ],
  MAX_BUILDINGS: 700,
  MAX_ROADS: 700,
  ROAD_TYPES: "motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|" +
              "service|pedestrian|footway|path|steps|cycleway|track",

  cacheKey(zone) { return "osm_cache_" + zone.zoneId; },

  query(lat, lng, radius) {
    return "[out:json][timeout:30];(" +
      'way["building"](around:' + radius + "," + lat + "," + lng + ");" +
      'way["highway"~"^(' + this.ROAD_TYPES + ')$"](around:' + radius + "," + lat + "," + lng + ");" +
      ");out geom;";
  },

  /** Metric-ish area of a small polygon, via the shoelace formula. */
  polygonArea(pts) {
    if (!pts || pts.length < 3) return 0;
    const lat0 = toRad(pts[0].lat);
    const mx = 111320 * Math.cos(lat0), my = 110540;
    let a = 0;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].lon * mx, yi = pts[i].lat * my;
      const xj = pts[j].lon * mx, yj = pts[j].lat * my;
      a += xj * yi - xi * yj;
    }
    return Math.abs(a / 2);
  },

  centroid(pts) {
    let la = 0, lo = 0;
    pts.forEach(p => { la += p.lat; lo += p.lon; });
    return { lat: la / pts.length, lng: lo / pts.length };
  },

  wayLength(pts) {
    let d = 0;
    for (let i = 1; i < pts.length; i++) d += haversine(pts[i - 1].lat, pts[i - 1].lon, pts[i].lat, pts[i].lon);
    return d;
  },

  async fetchAround(lat, lng, radius) {
    const body = "data=" + encodeURIComponent(this.query(lat, lng, radius));
    for (const url of this.ENDPOINTS) {
      try {
        const ctl = new AbortController();
        const timer = setTimeout(() => ctl.abort(), 25000);
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body, signal: ctl.signal
        });
        clearTimeout(timer);
        if (!res.ok) continue;
        const json = await res.json();
        if (json && json.elements) return { success: true, elements: json.elements, endpoint: url };
      } catch (e) {
        console.warn("[OSM] " + url + " failed:", e && e.message);
      }
    }
    return { success: false, message: "No Overpass endpoint answered." };
  },

  /** Turn raw Overpass elements into Atlas-registered features. */
  digest(elements) {
    const buildings = [], roads = [];
    for (const el of elements) {
      if (el.type !== "way" || !el.geometry || el.geometry.length < 2) continue;
      const tags = el.tags || {};
      if (tags.building && buildings.length < this.MAX_BUILDINGS) {
        const area = this.polygonArea(el.geometry);
        if (area < 12) continue;                 // sheds, bins, map noise
        const c = this.centroid(el.geometry);
        const row = Atlas.building(c.lat, c.lng, { tags, area, osmId: "way/" + el.id });
        buildings.push({ row, ring: el.geometry.map(p => [p.lat, p.lon]), area });
      } else if (tags.highway && roads.length < this.MAX_ROADS) {
        const mid = el.geometry[Math.floor(el.geometry.length / 2)];
        const row = Atlas.street(mid.lat, mid.lon, {
          tags, osmId: "way/" + el.id, length: this.wayLength(el.geometry)
        });
        roads.push({ row, line: el.geometry.map(p => [p.lat, p.lon]), highway: tags.highway });
      }
    }
    return { buildings, roads };
  },

  /* Road weights by class — motorways read as great roads, paths as tracks. */
  roadStyle(highway, zoom) {
    const major = { motorway: 9, trunk: 8, primary: 7, secondary: 6, tertiary: 5 };
    const minor = { residential: 4, unclassified: 4, living_street: 4, pedestrian: 3.5, service: 3 };
    const trail = { footway: 2, path: 2, steps: 2, cycleway: 2, track: 2.5 };
    const z = clamp((zoom - 15) * 0.28 + 1, 0.7, 2.1);
    if (major[highway]) return { weight: major[highway] * z, color: "#c9a869", opacity: .75, dash: null, cls: "rd-major" };
    if (minor[highway]) return { weight: minor[highway] * z, color: "#9d8a63", opacity: .62, dash: null, cls: "rd-minor" };
    return { weight: (trail[highway] || 2) * z, color: "#7d8a6a", opacity: .55, dash: "5 6", cls: "rd-trail" };
  }
};

/* -------------------------------------------------------------------------
   10. Character factory & progression
   ------------------------------------------------------------------------- */
const Characters = {
  BASE_ATTR: 8,
  POOL: 14,

  blankAllocation() {
    const o = {};
    ATTRS.forEach(a => { o[a.key] = 0; });
    return o;
  },

  /** base 8 + point buy + race mods + class mods, floored at 3. */
  finalAttributes(allocation, raceKey, classKey) {
    const out = {};
    ATTRS.forEach(a => { out[a.key] = this.BASE_ATTR + (allocation[a.key] || 0); });
    const apply = (mods) => { for (const k in mods) out[k] = (out[k] || 0) + mods[k]; };
    if (RACES[raceKey])   apply(RACES[raceKey].mods);
    if (CLASSES[classKey]) apply(CLASSES[classKey].mods);
    ATTRS.forEach(a => { out[a.key] = Math.max(3, out[a.key]); });
    return out;
  },

  create(userId, name, classKey, raceKey, allocation) {
    const ch = {
      characterId: uid("chr"), userId, name,
      class: classKey, race: raceKey,
      level: 1, experience: 0, unspentPoints: 0, gold: 60,
      attributes: this.finalAttributes(allocation, raceKey, classKey),
      stats: { hp: 0, maxHp: 0, mana: 0, maxMana: 0, stamina: 0, maxStamina: 0 },
      equipment: [],
      inventory: [],
      position: { latitude: null, longitude: null, lastUpdated: null },
      createdAt: nowTs()
    };
    this.refreshMaxes(ch, true);
    return ch;
  },

  /** Recompute derived maxima; optionally top the character right up. */
  refreshMaxes(ch, full) {
    const s = ch.stats;
    const mh = Calc.maxHp(ch), mm = Calc.maxMana(ch), ms = Calc.maxStamina(ch);
    s.maxHp = mh; s.maxMana = mm; s.maxStamina = ms;
    if (full) { s.hp = mh; s.mana = mm; s.stamina = ms; }
    s.hp = clamp(s.hp, 0, mh);
    s.mana = clamp(s.mana, 0, mm);
    s.stamina = clamp(s.stamina, 0, ms);
    return ch;
  },

  skillsFor(ch) {
    return CLASSES[ch.class].skills.filter(sk => ch.level >= sk.lvl);
  },

  addXp(ch, amount) {
    ch.experience += amount;
    const gains = [];
    while (ch.experience >= Calc.xpForLevel(ch.level)) {
      ch.experience -= Calc.xpForLevel(ch.level);
      ch.level += 1;
      ch.unspentPoints += 5;
      this.refreshMaxes(ch, true);
      const unlocked = CLASSES[ch.class].skills.filter(sk => sk.lvl === ch.level);
      gains.push({ level: ch.level, unlocked });
    }
    return gains;
  },

  save(ch) {
    Store.patch(K.characters, (all) => { all[ch.characterId] = ch; });
    API.request("/character/" + ch.characterId, "PATCH", ch);
  }
};

/* -------------------------------------------------------------------------
   11. Zone + node generation
   ------------------------------------------------------------------------- */
const Zones = {
  createZone(userId, lat, lng, label) {
    const s = settings();
    const zone = {
      zoneId: uid("zn"), userId, label: label || "Home Base",
      centerLatitude: lat, centerLongitude: lng,
      radius: s.zoneRadius, seed: uid("seed"),
      createdAt: nowTs(), lastModified: nowTs()
    };
    Store.patch(K.zones, (z) => { z[zone.zoneId] = zone; });
    API.request("/location/create-zone", "POST", zone);
    return zone;
  },

  zonesFor(userId) {
    const z = Store.get(K.zones, {}) || {};
    return Object.values(z).filter(x => x.userId === userId);
  },

  nodesIn(zoneId) {
    const all = Store.get(K.nodes, {}) || {};
    return Object.values(all).filter(n => n.zoneId === zoneId);
  },

  /**
   * Procedural placement. Nodes go in a ring between 45m and the zone radius
   * so nothing spawns literally on top of the player, are spaced at least
   * 35m apart, and get a difficulty that rises with distance from home.
   */
  generateNodes(zone, count, playerLevel) {
    const s = settings();
    const rand = seededRandom(zone.seed + ":" + (count || s.nodeCount));
    const target = count || s.nodeCount;
    const minR = 45, maxR = zone.radius;
    const placed = [];
    let guard = 0;

    while (placed.length < target && guard < target * 60) {
      guard++;
      const bearing = rand() * 360;
      // sqrt keeps the ring area-uniform instead of clustering near the centre
      const dist = minR + Math.sqrt(rand()) * (maxR - minR);
      const p = projectPoint(zone.centerLatitude, zone.centerLongitude, dist, bearing);
      const tooClose = placed.some(o =>
        haversine(o.latitude, o.longitude, p.latitude, p.longitude) < 34);
      if (tooClose) continue;

      const distRatio = (dist - minR) / Math.max(1, maxR - minR);
      let type;
      const roll = rand();
      if (placed.length === target - 1 && !placed.some(n => n.type === "boss")) type = "boss";
      else if (roll < 0.60) type = "combat";
      else if (roll < 0.80) type = "treasure";
      else if (roll < 0.90) type = "landmark";
      else type = "boss";

      // Far nodes are meaner. That is the whole point of the walking.
      const difficulty = clamp(
        Math.round(1 + distRatio * 6 + rand() * 2 + (playerLevel - 1) * 0.55 + (type === "boss" ? 3 : 0)),
        1, 10);

      placed.push({
        nodeId: uid("nd"), zoneId: zone.zoneId, type, difficulty,
        latitude: p.latitude, longitude: p.longitude,
        name: pick(NODE_NAMES[type]),
        icon: { combat: "⚔️", treasure: "📦", boss: "👑", landmark: "⛲" }[type],
        status: "undiscovered",
        enemies: [],
        rewards: {
          experience: Math.round((70 + difficulty * 55) * (type === "boss" ? 2.4 : type === "treasure" ? 0.35 : 1)),
          gold: Math.round((18 + difficulty * 16) * (type === "treasure" ? 2.2 : type === "boss" ? 2.6 : 1)),
          items: []
        },
        distanceFromHome: Math.round(dist),
        discoveredAt: null, clearedAt: null
      });
    }

    Store.patch(K.nodes, (all) => { placed.forEach(n => { all[n.nodeId] = n; }); });
    API.request("/nodes/generate", "POST", { zoneId: zone.zoneId, nodes: placed });
    return placed;
  },

  updateNode(node, patch) {
    Object.assign(node, patch);
    Store.patch(K.nodes, (all) => { all[node.nodeId] = node; });
    API.request("/nodes/" + node.nodeId + "/status", "PATCH", patch);
  },

  /** Replace cleared nodes so the map keeps giving you reasons to walk. */
  respawnCleared(zone, playerLevel) {
    const nodes = this.nodesIn(zone.zoneId);
    const cleared = nodes.filter(n => n.status === "cleared" && n.type !== "landmark");
    if (cleared.length < 3) return 0;
    const toRemove = cleared.slice(0, cleared.length - 1);
    Store.patch(K.nodes, (all) => { toRemove.forEach(n => { delete all[n.nodeId]; }); });
    zone.seed = uid("seed");
    Store.patch(K.zones, (z) => { z[zone.zoneId] = zone; });
    const fresh = this.generateNodes(zone, toRemove.length, playerLevel);
    return fresh.length;
  }
};

/* -------------------------------------------------------------------------
   12. LocationService
   Wraps geolocation, distance accumulation and node proximity checks.
   Simulated positions from the dev panel flow through the exact same path,
   so nothing downstream needs to know where a fix came from.
   ------------------------------------------------------------------------- */
const Loc = {
  watchId: null,
  simulated: false,
  last: null,           // { latitude, longitude, accuracy, ts }
  lastAccepted: 0,
  status: "idle",       // idle | requesting | live | simulated | denied | error
  listeners: [],

  permissionState: "unknown",   // granted | prompt | denied | unknown

  onUpdate(fn) { this.listeners.push(fn); },
  _emit() { this.listeners.forEach(fn => { try { fn(this.last); } catch (e) { console.error(e); } }); },

  /**
   * Why location might not work here. Browsers only hand out GPS on a secure
   * origin, and Chrome and Safari additionally refuse to remember a permission
   * for a file:// page — there is no origin to attach it to — so the prompt
   * never appears at all. That is the single most common reason this page
   * looks like it "never asked".
   */
  diagnose() {
    const proto = location.protocol;
    const host = location.hostname;
    const localhost = host === "localhost" || host === "127.0.0.1" || host === "[::1]" || host === "";
    return {
      protocol: proto,
      host: host || "(none)",
      href: location.href,
      hasGeo: !!navigator.geolocation,
      isFile: proto === "file:",
      isLocalhost: localhost,
      secureContext: !!window.isSecureContext,
      // file: reports as a secure context but still cannot hold a permission
      canPrompt: !!navigator.geolocation && proto !== "file:" &&
                 (proto === "https:" || localhost),
      permission: this.permissionState
    };
  },

  /** Read the stored permission where the browser exposes it. */
  async permissionQuery() {
    try {
      if (!navigator.permissions || !navigator.permissions.query) return "unknown";
      const st = await navigator.permissions.query({ name: "geolocation" });
      this.permissionState = st.state;
      st.onchange = () => {
        this.permissionState = st.state;
        if (st.state === "granted" && settings().locationMode === "gps" && this.watchId == null) this.start();
        Game.renderHud();
      };
      return st.state;
    } catch (e) { return "unknown"; }
  },

  /**
   * Ask for permission. MUST be called from a click or tap: several browsers
   * only surface the prompt while the page has user activation, which is why
   * asking silently at load can look like nothing happened.
   */
  requestPermission() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        return resolve({ ok: false, code: 0, message: "This browser has no Geolocation API." });
      }
      // Permission may already have been granted elsewhere (browser settings,
      // another tab) and a watch may already be feeding us. Don't ask again.
      if (this.status === "live" && this.last && !this.simulated && nowTs() - this.last.ts < 60000) {
        this.permissionState = "granted";
        return resolve({ ok: true, accuracy: this.last.accuracy || 0 });
      }

      this.status = "requesting";
      Game.renderHud();
      let retried = false;

      const onOk = (pos) => {
        this.permissionState = "granted";
        this.simulated = false;
        this.status = "live";
        this.accept({
          latitude: pos.coords.latitude, longitude: pos.coords.longitude,
          accuracy: pos.coords.accuracy, ts: nowTs()
        }, true);
        this.start();                        // hold the watch open from here
        resolve({ ok: true, accuracy: pos.coords.accuracy });
      };
      const onErr = (err) => {
        // High accuracy can time out indoors; a coarse fix is better than none.
        if (err.code === 3 && !retried) {
          retried = true;
          navigator.geolocation.getCurrentPosition(onOk, onErr,
            { enableHighAccuracy: false, timeout: 15000, maximumAge: 120000 });
          return;
        }
        this.status = err.code === 1 ? "denied" : "error";
        if (err.code === 1) this.permissionState = "denied";
        Game.renderHud();
        resolve({ ok: false, code: err.code, message: err.message || "" });
      };
      // maximumAge lets the browser answer with a fix it already holds. Asking
      // for a brand-new sample (maximumAge 0) can hang for a stationary device
      // whose position genuinely hasn't changed.
      navigator.geolocation.getCurrentPosition(onOk, onErr,
        { enableHighAccuracy: settings().highAccuracy, timeout: 15000, maximumAge: 30000 });
    });
  },

  /**
   * Real GPS is the default and the only thing that moves you, unless the
   * player has explicitly ticked dev testing. A denial is reported, never
   * papered over with a fake position.
   */
  start() {
    const s = settings();
    if (s.locationMode === "sim") {
      this.stop();
      this.startSimulated();
      Game.setLocStatus("Dev testing — your real location is ignored.");
      return;
    }
    if (!navigator.geolocation) {
      this.status = "error";
      Game.onLocationProblem("This browser has no geolocation support.");
      return;
    }
    this.stop();                 // never stack watches
    this.status = "requesting";
    Game.setLocStatus("Asking for your location…");
    this.watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const first = !this.last || this.simulated;
        this.simulated = false;
        this.status = "live";
        this.accept({
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
          ts: nowTs()
        }, first);
        if (first) Game.setLocStatus("Location locked on. ±" + Math.round(pos.coords.accuracy) + " m.");
      },
      (err) => {
        this.status = err.code === 1 ? "denied" : "error";
        if (err.code === 1) this.permissionState = "denied";
        Game.onLocationProblem(err.code === 1
          ? "Location permission was denied."
          : err.code === 3 ? "Location timed out — no fix yet."
          : "Location is unavailable on this device right now.", err.code);
      },
      { enableHighAccuracy: s.highAccuracy, maximumAge: 3000, timeout: 15000 }
    );
  },

  stop() {
    if (this.watchId != null && navigator.geolocation) {
      navigator.geolocation.clearWatch(this.watchId);
    }
    this.watchId = null;
  },

  startSimulated(lat, lng) {
    this.simulated = true;
    this.status = "simulated";
    const la = lat != null ? lat : (this.last ? this.last.latitude : 41.8827);
    const ln = lng != null ? lng : (this.last ? this.last.longitude : -87.6233);
    this.accept({ latitude: la, longitude: ln, accuracy: 5, ts: nowTs(), sim: true });
  },

  /** Manual/simulated move — same pipeline as a real GPS fix. */
  simulateTo(lat, lng) {
    this.simulated = true;
    if (this.status !== "live") this.status = "simulated";
    this.accept({ latitude: lat, longitude: lng, accuracy: 5, ts: nowTs(), sim: true }, true);
  },

  accept(fix, force) {
    const s = settings();
    if (!force && this.last && nowTs() - this.lastAccepted < s.gpsUpdateInterval) return;
    // Ignore jitter smaller than the reported accuracy — stops the walk
    // counter inflating while you sit still.
    if (this.last) {
      const moved = haversine(this.last.latitude, this.last.longitude, fix.latitude, fix.longitude);
      const noiseFloor = fix.sim ? 0 : Math.max(4, Math.min(25, (fix.accuracy || 15) * 0.6));
      if (moved > noiseFloor) Walk.add(moved);
      else if (!force) { this.last = fix; this.lastAccepted = nowTs(); this._emit(); return; }
    }
    this.last = fix;
    this.lastAccepted = nowTs();
    this._emit();
  },

  nearest(nodes) {
    if (!this.last) return null;
    let best = null;
    for (const n of nodes) {
      if (n.status === "cleared") continue;
      const d = haversine(this.last.latitude, this.last.longitude, n.latitude, n.longitude);
      if (!best || d < best.distance) best = { node: n, distance: d };
    }
    return best;
  },

  distanceTo(node) {
    if (!this.last) return null;
    return haversine(this.last.latitude, this.last.longitude, node.latitude, node.longitude);
  }
};

/* -------------------------------------------------------------------------
   13. Walk tracker — the part that actually nags you to move
   ------------------------------------------------------------------------- */
const Walk = {
  todayKey() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); },
  data() {
    const w = Store.get(K.walk, null) || { day: this.todayKey(), meters: 0, total: 0, xpBanked: 0, goalHit: false };
    if (w.day !== this.todayKey()) { w.day = this.todayKey(); w.meters = 0; w.xpBanked = 0; w.goalHit = false; }
    return w;
  },
  add(meters) {
    if (!isFinite(meters) || meters <= 0 || meters > 400) return; // 400m in one tick = a car
    const w = this.data();
    w.meters += meters;
    w.total += meters;
    Store.set(K.walk, w);
    Game.onWalked(meters, w);
  },
  reset() { Store.set(K.walk, { day: this.todayKey(), meters: 0, total: 0, xpBanked: 0, goalHit: false }); }
};
/* -------------------------------------------------------------------------
   14. Toasts & tiny UI helpers
   ------------------------------------------------------------------------- */
const UI = {
  toastHost: null,
  toast(msg, kind, ms) {
    if (!this.toastHost) {
      this.toastHost = el("div"); this.toastHost.id = "toasts";
      document.body.appendChild(this.toastHost);
    }
    const t = el("div", "toast " + (kind || ""), msg);
    this.toastHost.appendChild(t);
    while (this.toastHost.children.length > 3) this.toastHost.removeChild(this.toastHost.firstChild);
    setTimeout(() => {
      t.style.transition = "opacity .3s,transform .3s";
      t.style.opacity = "0"; t.style.transform = "translateY(-8px)";
      setTimeout(() => t.remove(), 320);
    }, ms || 2600);
  },
  modal(opts) {
    const back = el("div", "modalBack");
    const m = el("div", "modal" + (opts.wide ? " lg" : ""));
    const head = el("div", "modalHead",
      (opts.icon ? '<span style="font-size:19px">' + opts.icon + "</span>" : "") +
      "<h3>" + esc(opts.title || "") + "</h3>");
    if (!opts.noClose) {
      const x = el("button", "closeX", "✕");
      x.onclick = () => close();
      head.appendChild(x);
    }
    const body = el("div", "modalBody");
    if (typeof opts.body === "string") body.innerHTML = opts.body;
    else if (opts.body) body.appendChild(opts.body);
    m.appendChild(head); m.appendChild(body);

    if (opts.buttons && opts.buttons.length) {
      const foot = el("div", "modalFoot");
      opts.buttons.forEach(b => {
        const btn = el("button", "btn " + (b.cls || "ghost"), b.label);
        btn.onclick = () => { const keep = b.onClick && b.onClick(close, body); if (!keep) close(); };
        foot.appendChild(btn);
      });
      m.appendChild(foot);
    }
    back.appendChild(m);
    if (!opts.noClose) back.addEventListener("click", (e) => { if (e.target === back) close(); });
    document.body.appendChild(back);
    function close() { back.remove(); if (opts.onClose) opts.onClose(); }
    return { close, body, root: back };
  },
  confirm(title, msg, onYes) {
    this.modal({
      title, body: '<p style="margin:0;color:var(--ink-2)">' + esc(msg) + "</p>",
      buttons: [
        { label: "Cancel", cls: "ghost" },
        { label: "Confirm", cls: "danger", onClick: () => { onYes(); } }
      ]
    });
  },
  bar(kind, cur, max) {
    const pct = max > 0 ? clamp(cur / max * 100, 0, 100) : 0;
    return '<div class="track"><div class="fill ' + kind + '" style="width:' + pct + '%"></div></div>';
  }
};

/* -------------------------------------------------------------------------
   15. Screens: routing
   ------------------------------------------------------------------------- */
const Screens = {
  root: null,
  current: null,
  init() { this.root = $("#app"); },
  show(name, payload) {
    this.current = name;
    this.root.innerHTML = "";
    if (name === "auth")   this.auth();
    if (name === "select") this.characterSelect();
    if (name === "create") this.create();
    if (name === "game")   Game.mount(this.root, payload);
  },

  /* ---- Auth ---- */
  auth() {
    const wrap = el("div", "pageWrap");
    const inner = el("div", "pageInner");
    inner.innerHTML =
      '<div class="brand"><h1>Stride &amp; Sword</h1><p>Walk further · Fight harder</p></div>' +
      '<div class="tabs"><button id="tLogin" class="on">Sign in</button><button id="tReg">Create account</button></div>' +
      '<div class="card" style="padding:18px">' +
        '<div id="formLogin">' +
          '<label class="field"><span>Username</span><input class="input" id="liUser" autocomplete="username"></label>' +
          '<label class="field"><span>Password</span><input class="input" id="liPass" type="password" autocomplete="current-password"></label>' +
          '<div class="err" id="liErr"></div>' +
          '<button class="btn primary block" id="liGo">Enter the world</button>' +
        '</div>' +
        '<div id="formReg" class="hidden">' +
          '<label class="field"><span>Username</span><input class="input" id="rgUser" autocomplete="username"></label>' +
          '<label class="field"><span>Email</span><input class="input" id="rgMail" type="email" autocomplete="email"></label>' +
          '<label class="field"><span>Password</span><input class="input" id="rgPass" type="password" autocomplete="new-password"></label>' +
          '<div class="err" id="rgErr"></div>' +
          '<button class="btn primary block" id="rgGo">Create account</button>' +
        '</div>' +
      '</div>' +
      '<p class="tiny dimmer center" style="margin-top:16px;line-height:1.6">' +
        'Accounts live in this browser only. Passwords are obfuscated, not securely hashed — ' +
        'that moves server-side when the backend lands.' +
      '</p>';
    wrap.appendChild(inner);
    this.root.appendChild(wrap);

    const showTab = (reg) => {
      $("#tLogin").classList.toggle("on", !reg);
      $("#tReg").classList.toggle("on", reg);
      $("#formLogin").classList.toggle("hidden", reg);
      $("#formReg").classList.toggle("hidden", !reg);
    };
    $("#tLogin").onclick = () => showTab(false);
    $("#tReg").onclick   = () => showTab(true);

    const doLogin = async () => {
      const u = $("#liUser").value.trim(), p = $("#liPass").value;
      if (!u || !p) { $("#liErr").textContent = "Both fields are required."; return; }
      const r = await Auth.login(u, p);
      if (!r.success) { $("#liErr").textContent = r.message; return; }
      Screens.show("select");
    };
    const doReg = async () => {
      const u = $("#rgUser").value.trim(), m = $("#rgMail").value.trim(), p = $("#rgPass").value;
      if (u.length < 3) { $("#rgErr").textContent = "Username needs at least 3 characters."; return; }
      if (p.length < 4) { $("#rgErr").textContent = "Password needs at least 4 characters."; return; }
      const r = await Auth.register(u, m, p);
      if (!r.success) { $("#rgErr").textContent = r.message; return; }
      UI.toast("Welcome, " + esc(u) + ".", "good");
      Screens.show("create");
    };
    $("#liGo").onclick = doLogin;
    $("#rgGo").onclick = doReg;
    $("#liPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    $("#rgPass").addEventListener("keydown", e => { if (e.key === "Enter") doReg(); });
  },

  /* ---- Character select ---- */
  characterSelect() {
    const chars = Object.values(Store.get(K.characters, {}) || {})
      .filter(c => c.userId === Auth.current.userId);
    if (!chars.length) { this.show("create"); return; }

    const wrap = el("div", "pageWrap");
    const inner = el("div", "pageInner");
    inner.innerHTML =
      '<div class="brand"><h1>Stride &amp; Sword</h1><p>Choose your character</p></div>' +
      '<div id="charList" style="display:flex;flex-direction:column;gap:9px;margin-bottom:16px"></div>' +
      '<button class="btn block" id="newChar">+ New character</button>' +
      '<button class="btn ghost block" id="signOut" style="margin-top:8px">Sign out</button>';
    wrap.appendChild(inner);
    this.root.appendChild(wrap);

    const list = $("#charList");
    chars.sort((a, b) => b.createdAt - a.createdAt).forEach(c => {
      Characters.refreshMaxes(c);
      const row = el("button", "pick");
      row.innerHTML =
        '<h4><span class="ico">' + CLASSES[c.class].icon + '</span>' + esc(c.name) + '</h4>' +
        '<p>Level ' + c.level + " " + c.race + " " + c.class +
          ' · <span class="mono">' + c.stats.hp + "/" + c.stats.maxHp + ' HP</span>' +
          ' · <span class="mono">' + c.gold + ' g</span></p>' +
        '<div class="mods">' + ATTRS.map(a =>
            "<span>" + a.short + " " + c.attributes[a.key] + "</span>").join("") + "</div>";
      row.onclick = () => Game.start(c);
      list.appendChild(row);

      const del = el("button", "btn sm ghost", "Delete");
      del.style.cssText = "margin-top:8px";
      del.onclick = (e) => {
        e.stopPropagation();
        UI.confirm("Delete " + c.name + "?", "This cannot be undone.", () => {
          Store.patch(K.characters, (all) => { delete all[c.characterId]; });
          Store.patch(K.inventories, (all) => { delete all[c.characterId]; });
          API.request("/character/" + c.characterId, "DELETE");
          Screens.show("select");
        });
      };
      row.appendChild(del);
    });
    $("#newChar").onclick = () => this.show("create");
    $("#signOut").onclick = () => Auth.logout();
  },

  /* ---- Character creation ---- */
  create() {
    const state = { step: 0, cls: null, race: null, alloc: Characters.blankAllocation(), name: "" };
    const wrap = el("div", "pageWrap");
    const inner = el("div", "pageInner wide");
    wrap.appendChild(inner);
    this.root.appendChild(wrap);

    const spent = () => ATTRS.reduce((s, a) => s + state.alloc[a.key], 0);
    const left  = () => Characters.POOL - spent();

    function render() {
      const steps = ["Class", "Heritage", "Attributes", "Name"];
      inner.innerHTML =
        '<div class="brand"><h1>New Character</h1><p>' + steps[state.step] + '</p></div>' +
        '<div class="stepBar">' + steps.map((s, i) =>
          '<div class="' + (i <= state.step ? "on" : "") + '"></div>').join("") + '</div>' +
        '<div id="stepBody"></div>' +
        '<div style="display:flex;gap:8px;margin-top:18px">' +
          '<button class="btn ghost" id="back">Back</button>' +
          '<button class="btn primary" id="next" style="flex:1">Continue</button>' +
        '</div>';
      const body = $("#stepBody", inner);

      if (state.step === 0) {
        const g = el("div", "pickGrid");
        Object.values(CLASSES).forEach(c => {
          const b = el("button", "pick" + (state.cls === c.name ? " on" : ""));
          b.innerHTML =
            '<h4><span class="ico">' + c.icon + "</span>" + c.name + "</h4><p>" + esc(c.blurb) + "</p>" +
            '<div class="mods">' +
              Object.entries(c.mods).map(([k, v]) => {
                const a = ATTRS.find(x => x.key === k);
                return "<span>+" + v + " " + a.short + "</span>";
              }).join("") +
              "<span>HP ×" + c.hpMul.toFixed(2) + "</span>" +
              "<span>uses " + c.resource + "</span>" +
            "</div>";
          b.onclick = () => { state.cls = c.name; render(); };
          g.appendChild(b);
        });
        body.appendChild(g);

      } else if (state.step === 1) {
        const g = el("div", "pickGrid");
        Object.values(RACES).forEach(r => {
          const b = el("button", "pick" + (state.race === r.name ? " on" : ""));
          b.innerHTML =
            '<h4><span class="ico">' + r.icon + "</span>" + r.name + "</h4><p>" + esc(r.blurb) + "</p>" +
            '<div class="mods">' + Object.entries(r.mods).map(([k, v]) => {
              const a = ATTRS.find(x => x.key === k);
              return "<span>" + (v > 0 ? "+" : "") + v + " " + a.short + "</span>";
            }).join("") + "</div>";
          b.onclick = () => { state.race = r.name; render(); };
          g.appendChild(b);
        });
        body.appendChild(g);

      } else if (state.step === 2) {
        const pool = el("div", "poolBox");
        pool.innerHTML = "<span>Points remaining</span><b id='ptsLeft'>" + left() + "</b>";
        body.appendChild(pool);

        const card = el("div", "card");
        const finals = Characters.finalAttributes(state.alloc, state.race, state.cls);
        ATTRS.forEach(a => {
          const row = el("div", "attrRow");
          const modTotal = finals[a.key] - (Characters.BASE_ATTR + state.alloc[a.key]);
          row.innerHTML =
            '<div class="nm">' + a.name + "<small>" + a.blurb + "</small></div>" +
            '<button class="stepper" data-dec="' + a.key + '"' + (state.alloc[a.key] <= 0 ? " disabled" : "") + ">−</button>" +
            '<div class="val">' + finals[a.key] + "</div>" +
            '<button class="stepper" data-inc="' + a.key + '"' + (left() <= 0 || state.alloc[a.key] >= 6 ? " disabled" : "") + ">+</button>" +
            '<div class="bonus ' + (modTotal > 0 ? "pos" : modTotal < 0 ? "neg" : "") + '">' +
              (modTotal === 0 ? "—" : (modTotal > 0 ? "+" : "") + modTotal) + "</div>";
          card.appendChild(row);
        });
        body.appendChild(card);

        const preview = el("div");
        const draft = Characters.create("preview", "Preview", state.cls, state.race, state.alloc);
        preview.innerHTML =
          '<h4 style="margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ink-3)">Projected at level 1</h4>' +
          '<div class="previewGrid">' +
            pv("Health", draft.stats.maxHp) + pv("Mana", draft.stats.maxMana) +
            pv("Stamina", draft.stats.maxStamina) +
            pv("Attack", Math.round(Calc.attackPower(draft))) +
            pv("Spell", Math.round(Calc.spellPower(draft))) +
            pv("Armour", Calc.armor(draft)) +
            pv("Crit %", Calc.critChance(draft).toFixed(1)) +
            pv("Evasion", Calc.evasion(draft).toFixed(1)) +
          "</div>";
        body.appendChild(preview);

        body.addEventListener("click", (e) => {
          const inc = e.target.getAttribute && e.target.getAttribute("data-inc");
          const dec = e.target.getAttribute && e.target.getAttribute("data-dec");
          if (inc && left() > 0 && state.alloc[inc] < 6) { state.alloc[inc]++; render(); }
          if (dec && state.alloc[dec] > 0) { state.alloc[dec]--; render(); }
        });

      } else {
        const box = el("div", "card");
        box.style.padding = "18px";
        const draft = Characters.create("preview", "Preview", state.cls, state.race, state.alloc);
        box.innerHTML =
          '<label class="field"><span>Character name</span>' +
            '<input class="input" id="cName" maxlength="22" value="' + esc(state.name) + '" placeholder="e.g. Bram Ashwalk"></label>' +
          '<div class="err" id="cErr"></div>' +
          '<div class="divider"></div>' +
          '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
            '<div class="avatar" style="width:46px;height:46px;font-size:24px">' + CLASSES[state.cls].icon + "</div>" +
            "<div><b>" + state.race + " " + state.cls + "</b><br>" +
            '<span class="tiny dim">' + RACES[state.race].blurb + "</span></div></div>" +
          '<div class="statGrid">' + ATTRS.map(a =>
            '<div class="s"><span>' + a.short + "</span><b>" + draft.attributes[a.key] + "</b></div>").join("") + "</div>";
        body.appendChild(box);
        setTimeout(() => { const n = $("#cName"); if (n) n.focus(); }, 40);
      }

      $("#back", inner).onclick = () => {
        if (state.step === 0) {
          const has = Object.values(Store.get(K.characters, {}) || {})
            .some(c => c.userId === Auth.current.userId);
          Screens.show(has ? "select" : "auth");
          if (!has) Auth.logout();
        } else { state.step--; render(); }
      };
      const nextBtn = $("#next", inner);
      nextBtn.textContent = state.step === 3 ? "Begin" : "Continue";
      nextBtn.disabled = (state.step === 0 && !state.cls) || (state.step === 1 && !state.race);
      nextBtn.onclick = () => {
        if (state.step === 2 && left() > 0) {
          UI.toast("You still have " + left() + " points to spend.", "bad"); return;
        }
        if (state.step === 3) {
          const nm = ($("#cName").value || "").trim();
          if (nm.length < 2) { $("#cErr").textContent = "Give them a name of at least 2 characters."; return; }
          state.name = nm;
          const ch = Characters.create(Auth.current.userId, nm, state.cls, state.race, state.alloc);
          // A starter kit so round one isn't fists-only.
          const starter = Items.generate(1, ch.attributes.luck, 1,
            ch.class === "Mage" ? "weapon" : "weapon");
          const potion = Items.generate(1, 10, 1, "potion");
          ch.inventory = [starter, potion, Object.assign({}, potion, { itemId: uid("itm") })];
          Store.patch(K.characters, (all) => { all[ch.characterId] = ch; });
          Store.patch(K.inventories, (all) => { all[ch.characterId] = ch.inventory; });
          API.request("/character/create", "POST", ch);
          UI.toast(esc(nm) + " steps outside.", "good");
          Game.start(ch);
          return;
        }
        state.step++; render();
      };
    }
    function pv(label, val) {
      return '<div class="pv"><span>' + label + "</span><b>" + val + "</b></div>";
    }
    render();
  }
};

/* -------------------------------------------------------------------------
   16. Game controller + map + HUD
   ------------------------------------------------------------------------- */
const Game = {
  ch: null, zone: null, nodes: [], map: null, mapless: false,
  playerMarker: null, accCircle: null, zoneCircle: null,
  nodeMarkers: {}, rangeCircle: null,
  inCombat: false, locMsg: "", trail: null, trailPts: [],
  _pendingNode: null, _regenTimer: null,

  reset() {
    Loc.stop();
    if (this._regenTimer) clearInterval(this._regenTimer);
    this.ch = null; this.zone = null; this.nodes = []; this.map = null;
    this.nodeMarkers = {}; this.trailPts = []; this.inCombat = false;
    this.mapless = false;
    this.world = null; this._worldZone = null; this._worldBusy = false;
    this.tiles = null; this.worldLayer = null;
    this.streetLabels = null; this.buildingLabels = null;
    this._locPrompt = false;
  },

  start(ch) {
    Characters.refreshMaxes(ch);
    this.ch = ch;
    const inv = Store.get(K.inventories, {}) || {};
    if (inv[ch.characterId]) ch.inventory = inv[ch.characterId];
    Screens.show("game");
  },

  mount(root) {
    const screen = el("div", "screen");
    screen.id = "gameScreen";
    screen.innerHTML =
      '<div id="map"></div>' +
      '<div class="topBar">' +
        '<div class="charChip">' +
          '<div class="avatar" id="chAvatar"></div>' +
          '<div class="who"><b id="chName"></b><span id="chSub"></span></div>' +
        "</div>" +
        '<div class="spacer"></div>' +
        '<button class="iconBtn" id="btnSheet" title="Character">📋</button>' +
        '<button class="iconBtn" id="btnBag" title="Inventory">🎒</button>' +
        '<button class="iconBtn" id="btnMenu" title="Menu">☰</button>' +
      "</div>" +
      '<div id="devPanel" class="hidden"></div>' +
      '<div class="bars">' +
        '<div class="modeRow" id="modeRow">' +
          '<label class="modeLbl">' +
            '<input type="checkbox" id="modeToggle">' +
            '<span class="lbl">Dev test <small>simulate my location</small></span>' +
          "</label>" +
          '<button class="gpsChip" id="wGps">…</button>' +
        "</div>" +
        '<div class="walkStrip">' +
          '<div class="st"><span>Today</span><b id="wToday">0 m</b></div>' +
          '<div class="st"><span>All time</span><b id="wTotal">0 m</b></div>' +
          '<div class="st"><span>Nearest</span><b id="wNear">--</b></div>' +
        "</div>" +
        '<div class="barsInner">' +
          '<div class="bar"><span class="lbl">❤</span>' + UI.bar("hp", 1, 1) + '<span class="num" id="nHp"></span></div>' +
          '<div class="bar"><span class="lbl">✦</span>' + UI.bar("mp", 1, 1) + '<span class="num" id="nMp"></span></div>' +
          '<div class="bar"><span class="lbl">⚡</span>' + UI.bar("sp", 1, 1) + '<span class="num" id="nSp"></span></div>' +
          '<div class="bar"><span class="lbl">★</span>' + UI.bar("xp", 0, 1) + '<span class="num" id="nXp"></span></div>' +
        "</div>" +
      "</div>";
    root.appendChild(screen);

    $("#btnSheet").onclick = () => Panels.sheet();
    $("#btnBag").onclick   = () => Panels.inventory();
    $("#btnMenu").onclick  = () => Panels.menu();

    const toggle = $("#modeToggle");
    toggle.checked = settings().locationMode === "sim";
    toggle.onchange = (e) => this.setLocationMode(e.target.checked ? "sim" : "gps");
    $("#wGps").onclick = () => {
      if (settings().locationMode === "sim") { this.setLocationMode("gps"); return; }
      if (Loc.status === "live") { this.locationDiagnostics(); return; }
      this.beginLocation(true);
    };

    this.initMap();
    this.renderHud();
    this.buildDevPanel();

    Loc.onUpdate(() => this.onPosition());
    this.beginLocation();

    // If a watch is running but nothing arrives, say so — never silently
    // pretend to be somewhere.
    setTimeout(() => {
      if (!Loc.last && settings().locationMode === "gps" && Loc.watchId != null) {
        this.onLocationProblem("Still waiting on a location fix.", 3);
      }
    }, 25000);

    this._regenTimer = setInterval(() => this.passiveRegen(), 12000);
  },

  /* ---- Map ---- */
  initMap() {
    const s = settings();
    const start = Loc.last || { latitude: 41.8827, longitude: -87.6233 };

    // Leaflet comes off a CDN. If it didn't load (offline, blocked network),
    // fall back to a compass list so the game is still playable.
    if (typeof L === "undefined") {
      this.mapless = true;
      this.buildListView();
      setTimeout(() => UI.toast(
        "Map library didn't load — switched to list view. Reconnect and reload for the map.", "bad", 6500), 400);
      return;
    }

    // maxZoom 22 with maxNativeZoom 19 means deep zoom upscales the last real
    // tile instead of requesting tiles that don't exist and going blank.
    this.map = L.map("map", {
      zoomControl: true, attributionControl: true,
      maxZoom: 22, minZoom: 12, zoomSnap: 0.5, zoomDelta: 0.5
    }).setView([start.latitude, start.longitude], s.mapZoom);

    this.tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 22, maxNativeZoom: 19, minZoom: 12, keepBuffer: 3,
      opacity: s.fantasyMap ? s.tileOpacity : 1,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(this.map);

    this.worldLayer = L.layerGroup().addTo(this.map);   // fantasy roads + buildings
    this.trail = L.polyline([], { color: "#4a8fd4", weight: 3, opacity: .5, dashArray: "4 6" }).addTo(this.map);

    // Dev: click to teleport (only while dev testing is switched on)
    this.map.on("click", (e) => {
      if (settings().locationMode !== "sim") return;
      Loc.simulateTo(e.latlng.lat, e.latlng.lng);
      UI.toast("Moved to " + e.latlng.lat.toFixed(5) + ", " + e.latlng.lng.toFixed(5), "info", 1500);
    });

    this.map.on("zoomend", () => this.applyZoomDetail());
    this.applyZoomDetail();
  },

  /** Buildings and street labels only make sense close in. */
  applyZoomDetail() {
    if (this.mapless || !this.map) return;
    const z = this.map.getZoom();
    const s = settings();
    const host = $("#map");
    if (host) host.classList.toggle("zBuildings", z >= 16);
    const swap = (layer, on) => {
      if (!layer) return;
      const has = this.map.hasLayer(layer);
      if (on && !has) this.map.addLayer(layer);
      if (!on && has) this.map.removeLayer(layer);
    };
    swap(this.streetLabels, s.fantasyMap && z >= s.labelZoom);
    swap(this.buildingLabels, s.fantasyMap && z >= s.labelZoom + 1.5);

    // Stroke width is in pixels, so roads need restyling as you zoom or they
    // read as hairlines up close and as a smear far out.
    if (this.roadLayers && this._styledZoom !== z) {
      this._styledZoom = z;
      this.roadLayers.forEach(r => {
        const st = OSM.roadStyle(r.highway, z);
        r.layer.setStyle({ weight: st.weight, opacity: st.opacity });
      });
    }
  },

  ensureZone() {
    if (this.zone || !Loc.last) return;
    const existing = Zones.zonesFor(this.ch.userId);
    const near = existing.find(z =>
      haversine(z.centerLatitude, z.centerLongitude, Loc.last.latitude, Loc.last.longitude) < z.radius * 1.6);
    if (near) {
      this.zone = near;
      this.nodes = Zones.nodesIn(near.zoneId);
      if (!this.nodes.length) this.nodes = Zones.generateNodes(near, null, this.ch.level);
    } else {
      this.zone = Zones.createZone(this.ch.userId, Loc.last.latitude, Loc.last.longitude, "Office Grounds");
      this.nodes = Zones.generateNodes(this.zone, null, this.ch.level);
      UI.toast("Zone anchored. " + this.nodes.length + " sites scattered nearby.", "good", 3400);
    }
    this.drawZone();
    this.drawNodes();
    this.loadWorld();
  },

  /* ---- The fantasy town: real OSM geometry, renamed and restyled ---- */
  async loadWorld(force) {
    if (this.mapless || !this.zone || this._worldBusy) return;
    if (!settings().fantasyMap) return;
    if (this._worldZone === this.zone.zoneId && !force) return;
    this._worldBusy = true;
    this._worldZone = this.zone.zoneId;

    const cacheKey = OSM.cacheKey(this.zone);
    let elements = force ? null : Store.get(cacheKey, null);

    if (!elements) {
      UI.toast("Surveying the streets…", "info", 2600);
      const r = await OSM.fetchAround(this.zone.centerLatitude, this.zone.centerLongitude,
                                      Math.round(this.zone.radius + 140));
      if (!r.success) {
        this._worldBusy = false;
        this._worldZone = null;
        UI.toast("Couldn't reach the map data service — showing the plain map. " +
                 "Try 'Resurvey the streets' from the menu later.", "bad", 6000);
        if (this.tiles) this.tiles.setOpacity(1);
        return;
      }
      elements = r.elements;
      // Cache geometry so a reload is instant and works offline.
      try {
        const payload = JSON.stringify(elements);
        if (payload.length < 2000000) Store.set(cacheKey, elements);
      } catch (e) { /* over quota — fine, we just refetch next time */ }
    }

    const world = OSM.digest(elements);
    this.world = world;
    this.renderWorld(world);
    this.snapNodesToBuildings(world);
    this._worldBusy = false;

    const st = Atlas.stats();
    UI.toast("The town takes shape: " + world.buildings.length + " buildings and " +
             st.streetNames + " named roads.", "good", 4200);
  },

  renderWorld(world) {
    if (this.mapless || !this.worldLayer) return;
    this.worldLayer.clearLayers();
    if (!this.streetLabels) this.streetLabels = L.layerGroup();
    if (!this.buildingLabels) this.buildingLabels = L.layerGroup();
    this.streetLabels.clearLayers();
    this.buildingLabels.clearLayers();
    const s = settings();
    if (this.tiles) this.tiles.setOpacity(s.fantasyMap ? s.tileOpacity : 1);

    // Roads first so buildings sit on top of them.
    this.roadLayers = [];
    const z0 = this.map.getZoom();
    world.roads.forEach(r => {
      const st = OSM.roadStyle(r.highway, z0);
      const line = L.polyline(r.line, {
        color: st.color, weight: st.weight, opacity: st.opacity,
        dashArray: st.dash, lineCap: "round", lineJoin: "round",
        className: "fRoad " + st.cls, interactive: true
      });
      line.bindTooltip(r.row.name, { className: "streetLabel", direction: "center", sticky: true });
      line.on("click", (e) => {
        L.DomEvent.stop(e);
        this.describeStreet(r.row);
      });
      this.worldLayer.addLayer(line);
      this.roadLayers.push({ layer: line, highway: r.highway });
    });

    world.buildings.forEach(b => {
      const kind = Atlas.KINDS[b.row.kind] || Atlas.KINDS.cottage;
      const poly = L.polygon(b.ring, {
        color: kind.color, weight: 1.2, opacity: .9,
        fillColor: kind.color, fillOpacity: .32,
        className: "fBuilding", interactive: true
      });
      poly.bindTooltip(kind.icon + " " + b.row.name, { className: "buildingLabel", direction: "top", sticky: true });
      poly.on("click", (e) => {
        L.DomEvent.stop(e);
        this.describeBuilding(b.row);
      });
      this.worldLayer.addLayer(poly);
      if (b.area > 140) {
        this.buildingLabels.addLayer(L.marker([b.row.latitude, b.row.longitude], {
          interactive: false, keyboard: false,
          icon: L.divIcon({ className: "pinWrap",
            html: '<div class="worldLabel bLabel">' + kind.icon + " " + esc(b.row.name) + "</div>",
            iconSize: [0, 0], iconAnchor: [0, 0] })
        }));
      }
    });

    // Label every named segment: at label zoom only a handful are on screen,
    // and you want the name of the road you're actually standing on.
    world.roads.forEach(r => {
      if (!r.row.realName) return;             // unnamed alleys stay unlabelled
      const mid = r.line[Math.floor(r.line.length / 2)];
      this.streetLabels.addLayer(L.marker(mid, {
        interactive: false, keyboard: false,
        icon: L.divIcon({ className: "pinWrap",
          html: '<div class="worldLabel sLabel">' + esc(r.row.name) + "</div>",
          iconSize: [0, 0], iconAnchor: [0, 0] })
      }));
    });

    this.applyZoomDetail();
  },

  describeBuilding(row) {
    UI.modal({
      title: row.name, icon: (Atlas.KINDS[row.kind] || {}).icon || "🏠",
      body:
        '<div class="kv"><span>Kind</span><b>' + esc(cap(row.kindLabel)) + "</b></div>" +
        '<div class="kv"><span>Footprint</span><b>' + row.area + " m²</b></div>" +
        (row.realName ? '<div class="kv"><span>Known to outsiders as</span><b>' + esc(row.realName) + "</b></div>" : "") +
        (row.address ? '<div class="kv"><span>Address</span><b>' + esc(row.address) + "</b></div>" : "") +
        '<div class="kv"><span>Atlas key</span><b class="tiny">' + esc(row.key) + "</b></div>" +
        '<div class="kv"><span>Source</span><b class="tiny">' + esc(row.osmId || row.source) + "</b></div>",
      buttons: [{ label: "Close", cls: "ghost" }]
    });
  },

  describeStreet(row) {
    UI.modal({
      title: row.name, icon: "🛣️",
      body:
        '<div class="kv"><span>Type</span><b>' + esc(row.kind.replace(/_/g, " ")) + "</b></div>" +
        (row.realName ? '<div class="kv"><span>Known to outsiders as</span><b>' + esc(row.realName) + "</b></div>" : "") +
        '<div class="kv"><span>Segment length</span><b>' + fmtDist(row.lengthM) + "</b></div>" +
        '<div class="kv"><span>Atlas key</span><b class="tiny">' + esc(row.key) + "</b></div>" +
        '<div class="kv"><span>Source</span><b class="tiny">' + esc(row.osmId || row.source) + "</b></div>",
      buttons: [{ label: "Close", cls: "ghost" }]
    });
  },

  /**
   * Move each site onto a real building so "walk to The Crooked Tankard" means
   * walking to an actual doorway. One building per site, nearest wins.
   */
  snapNodesToBuildings(world) {
    if (!settings().snapNodesToBuildings || !world.buildings.length) return;
    const taken = new Set(this.nodes.map(n => n.anchorKey).filter(Boolean));
    const MIN_GAP = 34;   // the same spacing the generator guarantees
    let moved = 0;
    this.nodes.forEach(n => {
      if (n.anchorKey || n.status === "cleared") return;
      // Nearest building that doesn't shove this site onto a neighbour.
      const near = Atlas.nearBuildings(n.latitude, n.longitude, 75, taken).find(cand =>
        this.nodes.every(o => o === n ||
          haversine(cand.row.latitude, cand.row.longitude, o.latitude, o.longitude) >= MIN_GAP));
      if (!near) return;
      taken.add(near.row.key);
      Zones.updateNode(n, {
        latitude: near.row.latitude, longitude: near.row.longitude,
        anchorKey: near.row.key, anchorName: near.row.name,
        anchorKind: near.row.kindLabel,
        name: near.row.name,
        icon: n.type === "boss" ? "👑" : n.type === "treasure" ? "📦" :
              n.type === "landmark" ? "⛲" : (Atlas.KINDS[near.row.kind] || {}).icon || "⚔️"
      });
      moved++;
    });
    if (moved) { this.drawNodes(); this.renderHud(); }
  },

  /* Fallback presentation when Leaflet is unavailable. */
  buildListView() {
    const host = $("#map");
    if (!host) return;
    host.innerHTML =
      '<div id="listView" style="position:absolute;inset:0;overflow-y:auto;padding:58px 12px 190px">' +
        '<div class="card" style="padding:12px;margin-bottom:10px">' +
          '<b style="font-size:13px">List view</b>' +
          '<p class="tiny dim" style="margin:5px 0 0">The map tiles could not load. Sites are listed by ' +
          'distance and bearing instead — walk toward one and it will open the same way.</p>' +
        "</div>" +
        '<div id="listNodes"></div>' +
      "</div>";
  },

  renderListView() {
    const host = $("#listNodes");
    if (!host) return;
    const rows = this.nodes.map(n => {
      const d = Loc.distanceTo(n);
      return { n, d: d == null ? Infinity : d };
    }).sort((a, b) => a.d - b.d);
    const s = settings();
    host.innerHTML = "";
    if (!rows.length) { host.innerHTML = '<div class="emptyMsg">Waiting for a position fix…</div>'; return; }
    rows.forEach(({ n, d }) => {
      const inRange = d <= s.interactRange;
      const row = el("div", "item r-" + (n.status === "cleared" ? "common" :
        n.type === "boss" ? "epic" : n.type === "treasure" ? "legendary" : "rare"));
      row.style.cursor = "pointer";
      const brg = Loc.last ? Game.bearingTo(Loc.last.latitude, Loc.last.longitude, n.latitude, n.longitude) : 0;
      const compass = ["N","NE","E","SE","S","SW","W","NW"][Math.round(brg / 45) % 8];
      row.innerHTML =
        '<span class="ico">' + (n.status === "cleared" ? "✓" : n.icon) + "</span>" +
        '<div class="body"><div class="nm">' + esc(n.name) +
          (n.type !== "landmark" ? ' <span class="badge">d' + n.difficulty + "</span>" : "") + "</div>" +
        '<div class="ds">' + fmtDist(d) + " · " + compass + " · " + cap(n.status) + "</div></div>" +
        '<div class="acts"><span class="badge" style="' +
          (inRange && n.status !== "cleared" ? "border-color:var(--ok);color:var(--ok)" : "") + '">' +
          (n.status === "cleared" ? "done" : inRange ? "in range" : "walk") + "</span></div>";
      row.onclick = () => this.openNode(n);
      host.appendChild(row);
    });
  },

  drawZone() {
    if (this.mapless) return;
    if (this.zoneCircle) this.map.removeLayer(this.zoneCircle);
    this.zoneCircle = L.circle([this.zone.centerLatitude, this.zone.centerLongitude], {
      radius: this.zone.radius, color: "#e0a33e", weight: 1, opacity: .35,
      fillColor: "#e0a33e", fillOpacity: .04, className: "rangeRing", interactive: false
    }).addTo(this.map);
  },

  drawNodes() {
    if (this.mapless) { this.renderListView(); return; }
    for (const id in this.nodeMarkers) this.map.removeLayer(this.nodeMarkers[id]);
    this.nodeMarkers = {};
    this.nodes.forEach(n => this.drawNode(n));
  },

  drawNode(n) {
    if (this.mapless) { this.renderListView(); return; }
    if (this.nodeMarkers[n.nodeId]) { this.map.removeLayer(this.nodeMarkers[n.nodeId]); }
